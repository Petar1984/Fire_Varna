<script id="hydrantData" type="application/json"></script>
<script>
window._hydrantDataReady = (async function loadHydrantData() {
  try {
    const response = await fetch('data/hydrants.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const text = await response.text();
    document.getElementById('hydrantData').textContent = text;
    return true;
  } catch (err) {
    console.error('Hydrant data load failed:', err);
    document.body.innerHTML = `
      <div style="padding:24px;text-align:center;font-family:system-ui,sans-serif;max-width:420px;margin:60px auto;line-height:1.5">
        <h2 style="color:#c00;margin:0 0 12px">?? ?????? ??? ?????????</h2>
        <p style="margin:0 0 20px">??????? ?? ?????????? ?? ?? ????????. ???? ????????? ???????? ????????.</p>
        <button onclick="location.reload()" style="padding:14px 28px;font-size:16px;background:#c00;color:white;border:none;border-radius:8px;cursor:pointer">?????????</button>
      </div>`;
    throw err;
  }
})();
</script>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span id="modalTitle">🚨 Сигнал за хидрант</span>
      <button class="modal-close" id="modalClose" aria-label="Затвори">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
(async function() {
  // ===== Constants =====
  const NEAR_THRESHOLD_M = 100;
  const TOP_K = 5;
  const HEADING_SMOOTHING = 0.10;  // EMA alpha (0..1, lower = smoother)
  const ABSOLUTE_ORIENTATION_STALE_MS = 1500;
  const WEBKIT_COMPASS_MAX_ACCURACY_DEG = 45;

  // ===== Schema adapter (Phase 1 of cleanup_execution_plan_20260508) =====
  // Bridges the current compact runtime schema and the future verbose schema
  // produced by Phase 2. Reads either shape and exposes both compatibility
  // fields (i, c, o, a, r, t) and semantic fields
  // (existence_status, operational_status, review_status, legacy_ids).
  const EXISTENCE_LABELS = {
    verified:   'Проверен',
    unverified: 'Непроверен',
    missing:    'Липсва'
  };
  const OPERATIONAL_LABELS = {
    works:       'Работи',
    not_working: 'Не работи',
    not_tested:  'Не е тестван'
  };

  function normalizeHydrantRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (raw.id == null || !Array.isArray(raw.coords) || raw.coords.length !== 2) {
      console.warn('normalizeHydrantRecord: skipping record with missing id/coords', raw);
      return null;
    }
    const lon = Number(raw.coords[0]), lat = Number(raw.coords[1]);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
      console.warn('normalizeHydrantRecord: skipping record with invalid coords', raw);
      return null;
    }
    const h = {
      id:                 raw.id,
      coords:             [lon, lat],
      origin:             raw.origin,
      address:            raw.address || '',
      region:             raw.region  || '',
      type:               raw.type    || '',
      existence_status:   raw.existence_status   || null,
      operational_status: raw.operational_status || null,
      review_status:      raw.review_status      || null,
      legacy_ids:         Array.isArray(raw.legacy_ids) ? raw.legacy_ids.slice() : []
    };
    if (raw.report_id   != null) h.report_id   = raw.report_id;
    if (raw.reported_at != null) h.reported_at = raw.reported_at;
    return h;
  }

  // Dual-index: canonical id plus every legacy_ids alias resolves to the same record.
  // resolveHydrantById is the single read path; callers must not touch HYDRANTS_BY_ID directly
  // for resolution — only for indexing new records via indexHydrant().
  function indexHydrant(h) {
    if (!h) return;
    HYDRANTS_BY_ID[h.id] = h;
    if (Array.isArray(h.legacy_ids)) {
      for (const alias of h.legacy_ids) {
        if (alias != null && alias !== h.id) HYDRANTS_BY_ID[alias] = h;
      }
    }
  }
  function resolveHydrantById(id) {
    if (id == null) return null;
    return HYDRANTS_BY_ID[id] || null;
  }

  // ===== Data =====
  await window._hydrantDataReady;
  const HYDRANTS_RAW = JSON.parse(document.getElementById('hydrantData').textContent);
  const HYDRANTS = [];
  const HYDRANTS_BY_ID = {};
  for (const raw of HYDRANTS_RAW) {
    const h = normalizeHydrantRecord(raw);
    if (!h) continue;
    HYDRANTS.push(h);
    indexHydrant(h);
  }
  document.getElementById('meta').textContent = HYDRANTS.length + ' точки';

  // ===== Map =====
  const map = L.map('map', { zoomControl: true, tap: true, attributionControl: false })
              .setView([43.2141, 27.9147], 13);
  // E3b — the address-search header is ~140px tall and .app-header sits at z-index
  // 1100 (so the search dropdown overlays the right-side controls); the default
  // top-left zoom control would otherwise be painted over and untappable. Move the
  // +/- buttons to the bottom-left, clear of the header, the right-side controls,
  // and the bottom-right locate FAB.
  map.zoomControl.setPosition('bottomleft');
  const OSM_ATTRIB = '© OpenStreetMap';
  const SAT_ATTRIB = 'Спътник: © Esri, Maxar, Earthstar Geographics, GIS User Community';
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);
  // E3a — Esri World Imagery satellite basemap (alternative, lazily added by the
  // 🛰️ toggle; never added by default so OSM stays the default basemap). The
  // legacy arcgisonline tiles need no API key; Esri attribution is required and
  // use is noncommercial (volunteer public-safety map). NO CARTO basemap is used.
  const satLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, maxNativeZoom: 19 }
  );
  // Attribution is managed explicitly by setBasemap so the OSM⇄satellite swap
  // always credits EXACTLY the active basemap (no layer auto-tracking, which can
  // leave a stale credit). Map was created with attributionControl:false.
  const attribCtrl = L.control.attribution({ prefix: false, position: 'bottomleft' }).addTo(map);
  attribCtrl.addAttribution(OSM_ATTRIB);

  // ===== Icons =====
  // Semantic precedence per cleanup_execution_plan_20260508 Section 1E.
  // Order matters: review state overrides existence/operational state because a
  // freshly reported issue is the most actionable signal for field workers.
  function hydrantStatusClass(h) {
    if (!h) return 'canonical';
    const review      = h.review_status;
    const existence   = h.existence_status;
    const operational = h.operational_status;
    if (review === 'reported' || review === 'pending_review') return 'reported';
    if (existence === 'missing') return 'missing'; // not expected in current data; caller filters before render
    if (existence === 'verified' && operational === 'works')       return 'operational';
    if (existence === 'verified' && operational === 'not_working') return 'broken';
    if (existence === 'verified') return 'verified';
    return 'canonical';
  }
  function makePin(rank, hydrant, isActive) {
    const status = hydrantStatusClass(hydrant);
    const cls = 'h-pin ' + status + (isActive ? ' first' : '');
    return L.divIcon({
      className: 'h-pin-wrapper',
      html: '<div class="' + cls + '"><span>' + rank + '</span></div>',
      iconSize: [28,28], iconAnchor: [14,28]
    });
  }
  function dimPin(hydrant) {
    const status = hydrantStatusClass(hydrant);
    return L.divIcon({
      className: 'h-pin-wrapper',
      html: '<div class="h-pin dim ' + status + '"><span>·</span></div>',
      iconSize:[22,22], iconAnchor:[11,22]
    });
  }

  // ===== State =====
  let userMarker = null, userAccuracyCircle = null, lineToTarget = null;
  let watchId = null;
  let visibleMarkers = [];
  let markersById = {};         // hydrant id -> array of L.marker (cluster member + active overlay can coexist in 'all' mode)
  let allClusterLayer = null;
  let allClusterInteractionOpen = false; // true while a cluster is spiderfied; suppresses routine refresh() during GPS updates
  let allModeActiveOverlay = null;       // single all-mode active overlay marker; tracked separately from visibleMarkers so updateAllModeActiveOverlay can replace it without a full refresh
  let lastFix = null;
  let userHeading = null;
  let smoothedHeading = null;
  let pendingHeading = null;     // raw heading awaiting rAF smoothing
  let lastAbsoluteHeadingTs = 0;
  let lastHeadingSourceUsed = null;
  let activeTargetIdx = 0;
  let activeTargetId = null;     // source of truth for the selected hydrant; activeTargetIdx is derived for in-list cases
  let currentRanked = [];
  let mode = 'top';
  let followMode = false;
  let isInitialFix = true;

  // ===== Pill =====
  const pill = document.getElementById('pill');
  function showLoadingPill() {
    pill.className = 'pill';
    pill.innerHTML = '<div class="spinner"></div><span>Откриване на локация...</span>';
  }
  function showErrorPill(msg, withRetry) {
    pill.className = 'pill error';
    pill.innerHTML = '<span>📍 ' + msg + '</span>' +
      (withRetry ? '<button id="pillRetry">Опитай</button>' : '') +
      '<button id="pillManual">Ръчно</button>';
    if (withRetry) document.getElementById('pillRetry').addEventListener('click', startTracking);
    document.getElementById('pillManual').addEventListener('click', () => { hidePill(); enterManualMode(); });
  }
  function hidePill() { pill.classList.add('hidden'); }

  // ===== Geolocation =====
  function startTracking() {
    if (!('geolocation' in navigator)) {
      showErrorPill('Този браузър не поддържа геолокация', false); return;
    }
    showLoadingPill();
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        hidePill();
        onLocation(pos);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(onLocation, onLocErr, {
          enableHighAccuracy: true, maximumAge: 5000, timeout: 20000
        });
      },
      (err) => showErrorPill(locErrText(err), true),
      { enableHighAccuracy: true, timeout: 20000 }
    );
  }
  function locErrText(err) {
    switch(err.code) {
      case 1: return 'Достъпът е отказан. Разрешете в настройките.';
      case 2: return 'Локацията не е достъпна. Проверете GPS.';
      case 3: return 'Времето изтече. Опитайте на открито.';
      default: return 'Грешка: ' + err.message;
    }
  }
  function onLocErr(err) { flashStatus('GPS: ' + locErrText(err), 4000); }
  function onLocation(pos) {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lastFix = { lat, lon, acc: pos.coords.accuracy };
    placeUser();
    if (isInitialFix) {
      isInitialFix = false;
      refresh(true);  // one-time auto-fit on first GPS lock
      return;
    }
    // Cluster guard: a spiderfy is open in all-mode. Skip refresh() so child
    // markers survive the GPS tick; update user-dependent visuals only.
    if (mode === 'all' && allClusterInteractionOpen) onUserMovedLightweight();
    else refresh(false);
    if (followMode) {
      map.setView([lastFix.lat, lastFix.lon], map.getZoom(),
                  { animate: true, duration: 0.3 });
    }
  }
  function placeUser() {
    if (!lastFix) return;
    if (!userMarker) {
      const userIcon = L.divIcon({
        className: 'user-marker-wrap',
        html: '<div class="user-cone hidden"></div><div class="user-dot"></div>',
        iconSize: [100, 100], iconAnchor: [50, 50]
      });
      userMarker = L.marker([lastFix.lat, lastFix.lon], {
        icon: userIcon, zIndexOffset: 1000, interactive: false
      }).addTo(map);
      userAccuracyCircle = L.circle([lastFix.lat, lastFix.lon], {
        // interactive:false — the GPS-accuracy circle is a visual only. Left
        // interactive (the Leaflet default) it swallows taps over buildings that
        // fall inside the radius (most visible in "Близо <100м" mode, where the
        // user is surrounded by nearby hydrants AND buildings), so building clicks
        // never reach the building layer. Non-interactive = clicks pass through;
        // the circle still renders identically.
        radius: lastFix.acc || 0, color:'#1976d2', weight:1, fillOpacity:0.1,
        interactive: false
      }).addTo(map);
    } else {
      userMarker.setLatLng([lastFix.lat, lastFix.lon]);
      userAccuracyCircle.setLatLng([lastFix.lat, lastFix.lon]).setRadius(lastFix.acc || 0);
    }
    updateUserCone();
  }

  function updateUserCone() {
    if (!userMarker) return;
    const el = userMarker.getElement();
    if (!el) return;
    const cone = el.querySelector('.user-cone');
    if (!cone) return;
    if (smoothedHeading == null) {
      cone.classList.add('hidden');
    } else {
      cone.classList.remove('hidden');
      cone.style.transform = 'rotate(' + smoothedHeading + 'deg)';
    }
  }

  // ===== Mode handling =====
  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.mode-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.mode === mode);
    });
    activeTargetIdx = 0;
    refresh(true);
  }
  document.querySelectorAll('.mode-chip').forEach(c => {
    c.addEventListener('click', () => setMode(c.dataset.mode));
  });

  // ===== Marker long-press =====
  // Tap = setActiveTarget (where applicable). Long-press (500ms with <12px
  // movement) = open report menu. Module-level state — only one press is
  // realistic at a time. Document-level move/end listeners detect cancel
  // even when the finger leaves the marker bounds.
  const LONG_PRESS_MS = 500;
  const LONG_PRESS_MOVE_PX_SQ = 144;
  let _lpStart = null;
  let _lpTimer = null;
  let _lpFired = false;
  let _lpCleanup = null;
  function _lpClear() {
    if (_lpTimer) clearTimeout(_lpTimer);
    _lpTimer = null;
    _lpStart = null;
    if (_lpCleanup) { _lpCleanup(); _lpCleanup = null; }
  }
  function _lpPoint(oe) {
    if (oe && oe.touches && oe.touches[0]) {
      return { x: oe.touches[0].clientX, y: oe.touches[0].clientY };
    }
    if (oe && typeof oe.clientX === 'number') {
      return { x: oe.clientX, y: oe.clientY };
    }
    return null;
  }
  function attachMarkerLongPress(m, onTap, onLongPress) {
    // Bind native pointer/touch events on the marker's DOM icon. Leaflet's
    // 'mousedown' on Android fires only AFTER touchend (synthesized), so the
    // 500ms timer was cancelled by mouseup ~1ms later and never fired. Native
    // pointerdown/touchstart fires immediately when the finger touches down.
    function bindNative() {
      const el = m._icon;
      if (!el || el._lpBound) return;
      el._lpBound = true;
      const supportsPointer = (typeof window.PointerEvent === 'function');
      const hasTouch = ('ontouchstart' in window);
      const startEvt  = supportsPointer ? 'pointerdown'   : (hasTouch ? 'touchstart'  : 'mousedown');
      const moveEvt   = supportsPointer ? 'pointermove'   : (hasTouch ? 'touchmove'   : 'mousemove');
      const endEvt    = supportsPointer ? 'pointerup'     : (hasTouch ? 'touchend'    : 'mouseup');
      const cancelEvt = supportsPointer ? 'pointercancel' : (hasTouch ? 'touchcancel' : null);
      el.addEventListener(startEvt, (oe) => {
        _lpClear();
        _lpFired = false;
        if (placementActive) return;
        const pt = _lpPoint(oe);
        if (!pt) return;
        _lpStart = pt;
        const onMove = (me) => {
          if (!_lpStart) return;
          const cur = _lpPoint(me);
          if (!cur) return;
          const dx = cur.x - _lpStart.x;
          const dy = cur.y - _lpStart.y;
          if (dx*dx + dy*dy > LONG_PRESS_MOVE_PX_SQ) _lpClear();
        };
        const onEnd = () => _lpClear();
        document.addEventListener(moveEvt, onMove, { passive: true });
        document.addEventListener(endEvt,  onEnd,  { passive: true });
        if (cancelEvt) document.addEventListener(cancelEvt, onEnd, { passive: true });
        _lpCleanup = () => {
          document.removeEventListener(moveEvt, onMove);
          document.removeEventListener(endEvt,  onEnd);
          if (cancelEvt) document.removeEventListener(cancelEvt, onEnd);
        };
        _lpTimer = setTimeout(() => {
          _lpTimer = null;
          _lpStart = null;
          if (_lpCleanup) { _lpCleanup(); _lpCleanup = null; }
          if (placementActive) return;
          _lpFired = true;
          if (onLongPress) onLongPress();
        }, LONG_PRESS_MS);
      }, { passive: true });
    }
    m.on('add', bindNative);
    if (m._icon) bindNative();
    m.on('click', () => {
      if (placementActive) { _lpFired = false; return; }
      if (_lpFired) { _lpFired = false; return; }
      if (onTap) onTap();
    });
    m.on('contextmenu', (e) => {
      // Suppress browser native contextmenu (Android long-press) — our
      // 500ms timer is the cross-platform source of truth.
      if (e.originalEvent && e.originalEvent.preventDefault) {
        e.originalEvent.preventDefault();
      }
    });
  }

  // ===== Refresh / render =====
  function refresh(autoFit) {
    if (!lastFix) return;

    // Compute distances to all
    const allRanked = HYDRANTS.map(h => ({
      h, d: haversine(lastFix.lat, lastFix.lon, h.coords[1], h.coords[0])
    })).sort((a,b) => a.d - b.d);

    // Determine visible set based on mode
    if (mode === 'near') {
      currentRanked = allRanked.filter(r => r.d <= NEAR_THRESHOLD_M);
    } else if (mode === 'top') {
      currentRanked = allRanked.slice(0, TOP_K);
    } else {
      // 'all' — currentRanked is just nearest 1 for active target tracking,
      // visual list will show top 10 for context
      currentRanked = allRanked.slice(0, 10);
    }

    if (activeTargetIdx >= currentRanked.length) activeTargetIdx = 0;
    activeTargetId = currentRanked.length ? currentRanked[activeTargetIdx].h.id : null;

    // Clear existing markers/line
    visibleMarkers.forEach(m => map.removeLayer(m));
    visibleMarkers = [];
    // Reset marker index. Old marker objects lose every reference here, so
    // _isActivePin / _rank / _pinKind tags are dropped with them. Each branch
    // below re-tags the freshly created markers using the current activeTargetIdx,
    // which is the only way the active flag is allowed to transition.
    markersById = {};
    if (lineToTarget) { map.removeLayer(lineToTarget); lineToTarget = null; }
    // Standalone overlay (added directly to map, not to allClusterLayer or
    // visibleMarkers) is tracked separately so updateAllModeActiveOverlay can
    // replace it without rebuilding the cluster. Tear it down here too.
    if (allModeActiveOverlay) { map.removeLayer(allModeActiveOverlay); allModeActiveOverlay = null; }
    if (allClusterLayer) { map.removeLayer(allClusterLayer); allClusterLayer = null; }
    allClusterInteractionOpen = false;

    if (mode === 'all') {
      // Render full cluster + a single highlighted nearest
      allClusterLayer = L.markerClusterGroup({
        maxClusterRadius: 60, showCoverageOnHover: false, spiderfyOnMaxZoom: true
      });
      // Cluster guard: track spiderfy state so routine GPS refresh() is skipped
      // while child markers are open (otherwise refresh() rebuilds the cluster
      // and dismisses the spiderfy mid-interaction).
      allClusterLayer.on('spiderfied',   () => { allClusterInteractionOpen = true;  });
      allClusterLayer.on('unspiderfied', () => { allClusterInteractionOpen = false; });
      HYDRANTS.forEach(h => {
        const m = L.marker([h.coords[1], h.coords[0]], { icon: dimPin(h) });
        m._hydrantId = h.id;
        m._pinKind = 'dim';
        m._isActivePin = false;
        (markersById[h.id] = markersById[h.id] || []).push(m);
        attachMarkerLongPress(
          m,
          () => selectHydrantAndOpenPopup(h, () => setActiveTargetHydrant(h)),
          () => { if (consumePrepickForHydrant(h)) return; setActiveTargetHydrant(h); showReportTypePicker(h); }
        );
        allClusterLayer.addLayer(m);
      });
      map.addLayer(allClusterLayer);
      // Add only the active target as a numbered pin on top.
      // Tracked via allModeActiveOverlay (not visibleMarkers) so the lightweight
      // overlay-update path can replace it without going through refresh().
      if (currentRanked.length) {
        const r0 = currentRanked[activeTargetIdx];
        allModeActiveOverlay = createActiveOverlayMarker(r0.h, activeTargetIdx + 1);
      }
    } else {
      // 'near' or 'top' — render numbered pins for currentRanked
      currentRanked.forEach((r, i) => {
        const isActive = i === activeTargetIdx;
        const m = L.marker([r.h.coords[1], r.h.coords[0]], {
          icon: makePin(i + 1, r.h, isActive),
          zIndexOffset: isActive ? 800 : 600 - i
        });
        m._hydrantId = r.h.id;
        m._pinKind = 'numbered';
        m._rank = i + 1;
        m._isActivePin = isActive;
        (markersById[r.h.id] = markersById[r.h.id] || []).push(m);
        attachMarkerLongPress(
          m,
          () => selectHydrantAndOpenPopup(r.h, () => setActiveTarget(i)),
          () => { if (consumePrepickForHydrant(r.h)) return; setActiveTarget(i); showReportTypePicker(r.h); }
        );
        m.addTo(map);
        visibleMarkers.push(m);
      });
    }

    redrawActiveLine();

    // Auto-fit only when explicitly requested (mode change / initial fix)
    if (autoFit) {
      if (mode !== 'all' && visibleMarkers.length > 0) {
        const group = L.featureGroup([userMarker, ...visibleMarkers]);
        map.fitBounds(group.getBounds(), { padding: [80, 80], maxZoom: 17 });
      } else if (userMarker) {
        map.setView([lastFix.lat, lastFix.lon], 16);
      }
    }

    // No bottom-sheet list/card to render — selection now surfaces via the
    // marker pin highlight, the line to the user, and the hydrant popup.
  }

  // ===== Active target =====
  function setActiveTarget(idx) {
    if (idx < 0 || idx >= currentRanked.length) return;
    activeTargetIdx = idx;
    activeTargetId = currentRanked[idx].h.id;
    if (mode === 'all' && allClusterInteractionOpen) updateAllModeActiveOverlay();
    else refresh(false);
  }

  // Returns { h, d, idx } for the currently selected hydrant, or null. d is
  // recomputed via Haversine from lastFix; idx is the position in
  // currentRanked, or -1 if the active hydrant is outside the visible list.
  function getActiveTarget() {
    if (!activeTargetId || !lastFix) return null;
    const h = HYDRANTS_BY_ID[activeTargetId];
    if (!h) return null;
    const d = haversine(lastFix.lat, lastFix.lon, h.coords[1], h.coords[0]);
    return { h, d, idx: currentRanked.findIndex(r => r.h.id === activeTargetId) };
  }

  // Selects a hydrant by reference. In near/top modes (or in-list all-mode
  // without an open spiderfy), delegates to refresh(false). In all-mode under
  // cluster guard, or for out-of-list selections, updates the overlay
  // incrementally without rebuilding the cluster, so any open spiderfy survives.
  function setActiveTargetHydrant(h) {
    if (!h || !h.id || !HYDRANTS_BY_ID[h.id]) return;
    activeTargetId = h.id;
    const idx = currentRanked.findIndex(r => r.h.id === h.id);
    if (idx >= 0) activeTargetIdx = idx;
    if (mode === 'all' && allClusterInteractionOpen) updateAllModeActiveOverlay();
    else if (idx >= 0) refresh(false);
    else updateAllModeActiveOverlay();
  }

  // Shared all-mode active-overlay marker constructor. Tags marker for polling
  // (_hydrantId / _pinKind / _rank / _isActivePin) so refreshMarkerIconsForHydrant
  // and moveMarkersForHydrant find it via markersById[id]. Caller assigns the
  // returned marker to allModeActiveOverlay.
  function createActiveOverlayMarker(h, rank) {
    const m = L.marker([h.coords[1], h.coords[0]], { icon: makePin(rank, h, true), zIndexOffset: 800 });
    m._hydrantId = h.id; m._pinKind = 'numbered'; m._rank = rank; m._isActivePin = true;
    (markersById[h.id] = markersById[h.id] || []).push(m);
    attachMarkerLongPress(m,
      () => selectHydrantAndOpenPopup(h, () => setActiveTargetHydrant(h)),
      () => { if (consumePrepickForHydrant(h)) return; setActiveTargetHydrant(h); showReportTypePicker(h); }
    );
    m.addTo(map);
    return m;
  }

  // Lightweight all-mode overlay update. Creates / updates / removes the
  // single all-mode active overlay marker without rebuilding allClusterLayer.
  // Must not call refresh().
  function updateAllModeActiveOverlay() {
    const detach = () => {
      if (!allModeActiveOverlay) return;
      const oid = allModeActiveOverlay._hydrantId;
      map.removeLayer(allModeActiveOverlay);
      if (oid && markersById[oid]) {
        markersById[oid] = markersById[oid].filter(mm => mm !== allModeActiveOverlay);
        if (!markersById[oid].length) delete markersById[oid];
      }
      allModeActiveOverlay = null;
    };
    const at = getActiveTarget();
    if (!at) {
      detach();
      if (lineToTarget) { map.removeLayer(lineToTarget); lineToTarget = null; }
      return;
    }
    // Out-of-list selections render with a neutral bullet; in-list keep their rank.
    const rank = at.idx >= 0 ? (at.idx + 1) : '·';
    if (allModeActiveOverlay && allModeActiveOverlay._hydrantId === at.h.id) {
      allModeActiveOverlay.setLatLng([at.h.coords[1], at.h.coords[0]]);
      allModeActiveOverlay.setIcon(makePin(rank, at.h, true));
      allModeActiveOverlay._rank = rank;
    } else {
      detach();
      allModeActiveOverlay = createActiveOverlayMarker(at.h, rank);
    }
    redrawActiveLine();
  }

  function redrawActiveLine() {
    if (lineToTarget) { map.removeLayer(lineToTarget); lineToTarget = null; }
    const at = getActiveTarget();
    if (!at) return;
    lineToTarget = L.polyline([[lastFix.lat, lastFix.lon], [at.h.coords[1], at.h.coords[0]]],
      // interactive:false — visual route line only (no click handler). Left interactive
      // it is a .leaflet-interactive path that can swallow building-layer clicks where it
      // crosses a footprint (same click-through fix as userAccuracyCircle).
      { color:'#ff9800', weight: 3, opacity: 0.8, dashArray: '8,6', interactive: false }).addTo(map);
  }

  // GPS tick path under the cluster guard: user marker already moved; only the
  // line to the active target needs redrawing (the heading cone is updated by
  // placeUser(); there is no longer a sheet card/arrow to refresh).
  function onUserMovedLightweight() {
    redrawActiveLine();
  }

  // ===== Compass bearing / cardinal helpers =====
  function bearing(lat1, lon1, lat2, lon2) {
    const toRad = x => x * Math.PI / 180;
    const toDeg = x => x * 180 / Math.PI;
    const dLon = toRad(lon2 - lon1);
    const y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
              Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  function cardinal(deg) {
    const dirs = ['С','СИ','И','ЮИ','Ю','ЮЗ','З','СЗ'];
    return dirs[Math.round(deg / 45) % 8];
  }

  function smoothHeading(raw) {
    if (smoothedHeading == null) { smoothedHeading = raw; return raw; }
    let diff = raw - smoothedHeading;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    smoothedHeading = (smoothedHeading + HEADING_SMOOTHING * diff + 360) % 360;
    return smoothedHeading;
  }

  // Per-frame heading smoothing. Runs one EMA step per rAF (deviceorientation
  // fires at 100-200Hz; we must not EMA in the event handler). The only live
  // compass UI left is the user heading cone — the bottom-sheet card and its
  // target arrow were removed in the popup pivot, and the hydrant popup shows a
  // direction snapshot captured at open time.
  let pendingFrame = false;
  function scheduleHeadingUpdate() {
    if (pendingFrame) return;
    pendingFrame = true;
    requestAnimationFrame(() => {
      pendingFrame = false;
      if (pendingHeading != null) {
        smoothHeading(pendingHeading);   // 1 EMA step per frame max
        pendingHeading = null;
      }
      updateUserCone();
    });
  }

  // ===== Compass init / smoothing =====
  let needsCompassPerm = false;

  function readOrientationHeading(event) {
    // Priority 1: iOS webkitCompassHeading (true-north, hardware-fused)
    if (typeof event.webkitCompassHeading === 'number' &&
        !isNaN(event.webkitCompassHeading)) {
      const acc = event.webkitCompassAccuracy;
      const recentAbsolute = (Date.now() - lastAbsoluteHeadingTs)
        < ABSOLUTE_ORIENTATION_STALE_MS;
      if (typeof acc === 'number' && acc > WEBKIT_COMPASS_MAX_ACCURACY_DEG
          && recentAbsolute) {
        return null; // Skip poor iOS sample, better data is recent
      }
      return { deg: event.webkitCompassHeading, source: 'webkit' };
    }
    // Priority 2: absolute deviceorientation (true-north on Android)
    if (event.absolute === true && typeof event.alpha === 'number'
        && !isNaN(event.alpha)) {
      return { deg: (360 - event.alpha) % 360, source: 'absolute' };
    }
    // Priority 3: relative deviceorientation — only if no recent absolute
    if (typeof event.alpha === 'number' && !isNaN(event.alpha)) {
      const recentAbsolute = (Date.now() - lastAbsoluteHeadingTs)
        < ABSOLUTE_ORIENTATION_STALE_MS;
      if (recentAbsolute) {
        return null; // Don't let relative overwrite recent absolute
      }
      return { deg: (360 - event.alpha) % 360, source: 'relative' };
    }
    return null;
  }

  function handleCompassHeading(sample) {
    if (!sample) return;
    if (sample.source === 'webkit' || sample.source === 'absolute') {
      lastAbsoluteHeadingTs = Date.now();
    }
    lastHeadingSourceUsed = sample.source;
    pendingHeading = sample.deg;
    scheduleHeadingUpdate();
  }

  function attachOrientation() {
    needsCompassPerm = false;
    const orientationListener = (event) =>
      handleCompassHeading(readOrientationHeading(event));
    window.addEventListener('deviceorientationabsolute', orientationListener);
    window.addEventListener('deviceorientation', orientationListener);
  }
  function requestCompassPerm() {
    if (typeof DeviceOrientationEvent === 'undefined') return;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(s => {
        if (s === 'granted') attachOrientation();
        else flashStatus('Достъпът до компас е отказан', 3500);
      }).catch(() => {});
    } else {
      attachOrientation();
    }
  }
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    needsCompassPerm = true;
  } else {
    attachOrientation();
  }

  // ===== Report: GitHub Issues volunteer flow =====
  // Petar fills the two TODO_ placeholders below before deploy.
  const GITHUB_REPO_OWNER = "Petar1984";
  const GITHUB_REPO_NAME  = "Fire_Varna";
  // PAT removed — issue creation now goes through the Cloudflare Worker proxy.
  const GITHUB_PAT        = "";
  const GITHUB_API_VERSION = "2022-11-28";
  const WORKER_URL        = "https://varna-hydrants-proxy.petar-dikov2019.workers.dev/";
  const APP_VERSION = "merged-2026-05-05";

  const LS_REPORTER = 'hydrants_reporter_name';
  const LS_RECENT   = 'hydrants_recent_reports';
  const LS_PENDING  = 'hydrants_pending_reports';

  const MIN_NAME_LEN = 2;
  const MAX_NAME_LEN = 50;
  const SUBMIT_THROTTLE_MS = 30 * 1000;
  const DEDUP_WINDOW_MS = 5 * 60 * 1000;

  // ----- Helpers -----
  function localISOString() {
    const d = new Date();
    const offset = -d.getTimezoneOffset();
    const sign = offset >= 0 ? '+' : '-';
    const hh = String(Math.floor(Math.abs(offset) / 60)).padStart(2, '0');
    const mm = String(Math.abs(offset) % 60).padStart(2, '0');
    const yyyy = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const HH = String(d.getHours()).padStart(2, '0');
    const MM = String(d.getMinutes()).padStart(2, '0');
    const SS = String(d.getSeconds()).padStart(2, '0');
    return yyyy + '-' + mo + '-' + dd + 'T' + HH + ':' + MM + ':' + SS + sign + hh + ':' + mm;
  }
  function uuidv4() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return fallback;
      return JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function getReporterName() {
    return lsGet(LS_REPORTER, null);
  }
  function setReporterName(name) {
    if (typeof name !== 'string') return;
    const trimmed = name.trim();
    if (trimmed.length < MIN_NAME_LEN || trimmed.length > MAX_NAME_LEN) return;
    lsSet(LS_REPORTER, trimmed);
  }

  // ----- Modal scaffolding -----
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalEl       = document.getElementById('modal');
  const modalTitle    = document.getElementById('modalTitle');
  const modalBody     = document.getElementById('modalBody');
  const modalFooter   = document.getElementById('modalFooter');

  let reportDraft = null;
  let lastSubmitTs = 0;
  const dedupMap = new Map();

  function openModal(title) {
    modalTitle.textContent = title;
    modalBody.innerHTML = '';
    modalFooter.innerHTML = '';
    modalBackdrop.classList.add('show');
  }
  function closeReportModal() {
    modalBackdrop.classList.remove('show');
    modalBody.innerHTML = '';
    modalFooter.innerHTML = '';
    reportDraft = null;
  }
  document.getElementById('modalClose').addEventListener('click', closeReportModal);
  modalBackdrop.addEventListener('click', (ev) => {
    if (ev.target !== modalBackdrop) return;
    // Welcome flow can be dismissed only via Скип / Готов.
    if (modalEl.classList.contains('welcome-mode')) return;
    closeReportModal();
  });

  // ----- Reporter identity bar -----
  function reporterBarHTML(name) {
    if (!name) return '';
    return '<div class="reporter-bar">' +
      '<span><span class="name">Докладва:</span> ' + escapeHtml(name) + '</span>' +
      '<button type="button" class="change-link" data-act="change-name">Промени име</button>' +
    '</div>';
  }
  function wireReporterBar() {
    const btn = modalBody.querySelector('[data-act="change-name"]');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const cur = getReporterName() || '';
      const next = window.prompt('Твоето име или handle (' + MIN_NAME_LEN + '–' + MAX_NAME_LEN + ' символа)', cur);
      if (next == null) return;
      const trimmed = next.trim();
      if (trimmed.length < MIN_NAME_LEN || trimmed.length > MAX_NAME_LEN) {
        flashStatus('Името трябва да е между ' + MIN_NAME_LEN + ' и ' + MAX_NAME_LEN + ' символа', 3500);
        return;
      }
      setReporterName(trimmed);
      if (reportDraft) reportDraft.reporter = trimmed;
      const bar = modalBody.querySelector('.reporter-bar');
      if (bar) {
        bar.outerHTML = reporterBarHTML(trimmed);
        wireReporterBar();
      }
      const nameInput = modalBody.querySelector('[data-field="reporter"]');
      if (nameInput) nameInput.value = trimmed;
    });
  }

  // ----- Type picker -----
  // hydrant === null  → global "+" entry, shows all 5 types incl. new_hydrant
  // hydrant === <obj> → per-hydrant 🚨 entry, shows the 4 existing-hydrant types
  function showReportTypePicker(hydrant) {
    // Clear any prior pre-pick state — opening the menu starts a fresh choice.
    hidePrepickBanner();
    reportDraft = { hydrant: hydrant, type: null };
    openModal(hydrant ? '🚨 Сигнал за хидрант' : 'Какво да докладваш?');
    const newOption = hydrant ? '' :
      '<button type="button" class="type-btn new" data-type="new_hydrant">Нов хидрант</button>';
    modalBody.innerHTML =
      reporterBarHTML(getReporterName()) +
      targetCardHTML(null, hydrant, null) +
      '<div class="field"><label>Какво има да се докладва?</label>' +
        '<div class="type-picker">' +
          newOption +
          '<button type="button" class="type-btn exists"  data-type="exists_confirmed">Хидрантът е там</button>' +
          '<button type="button" class="type-btn missing" data-type="missing">Хидрант липсва</button>' +
          '<button type="button" class="type-btn wrong"   data-type="wrong_location">Грешна локация</button>' +
          '<button type="button" class="type-btn damaged" data-type="damaged">Повреден</button>' +
        '</div>' +
      '</div>';
    modalFooter.innerHTML =
      '<button class="modal-btn cancel" data-act="cancel">Отказ</button>';
    wireReporterBar();
    modalBody.querySelectorAll('.type-btn').forEach(b => {
      b.addEventListener('click', () => {
        const t = b.dataset.type;
        if (hydrant) {
          if (t === 'wrong_location') {
            closeReportModal();
            beginWrongLocationPlacement(hydrant);
            return;
          }
          showReportModal(hydrant, t);
          return;
        }
        // No-hydrant context (global "+" entry).
        if (t === 'new_hydrant') {
          closeReportModal();
          const draft = { reporter: getReporterName() || '' };
          enterLocationPlacementMode(lastFix ? [lastFix.lon, lastFix.lat] : null, (coord) => {
            if (!coord) return;
            draft.placedCoord = coord;
            showReportModal(null, 'new_hydrant', draft);
          });
        } else {
          // Pre-pick: remember the chosen type, show banner, wait for the
          // user's next hydrant tap to consume and route into the flow.
          closeReportModal();
          showPrepickBanner(t);
        }
      });
    });
    modalFooter.querySelector('[data-act="cancel"]').addEventListener('click', closeReportModal);
  }

  // ----- Report form (per type) -----
  function modalTitleForType(t) {
    switch (t) {
      case 'exists_confirmed': return '✓ Хидрантът е там';
      case 'missing':          return '✗ Хидрант липсва';
      case 'wrong_location':   return '⚠ Грешна локация';
      case 'damaged':          return '⚠ Повреден';
      case 'new_hydrant':      return '➕ Нов хидрант';
      default:                 return '🚨 Сигнал за хидрант';
    }
  }
  function hydrantTypeLabel(typeValue) {
    if (typeValue === 'надземен') return 'Надземен';
    if (typeValue === 'подземен') return 'Подземен';
    return '';
  }
  // Picker value -> canonical schema value. Returning null means "omit from
  // the canonical YAML payload" — the opt-out "не знам" and any unexpected
  // value collapse to null so the Worker parser never has to second-guess.
  function canonicalTypeFromPicker(pickerValue) {
    if (pickerValue === 'надземен' || pickerValue === 'подземен') return pickerValue;
    return null;
  }
  function canonicalOperationalFromPicker(pickerValue) {
    if (pickerValue === 'да') return 'works';
    if (pickerValue === 'не') return 'not_working';
    if (pickerValue === 'не съм проверявал') return 'not_tested';
    return null;
  }
  function targetCardHTML(reportType, hydrant, placedCoord) {
    if (reportType === 'new_hydrant') {
      if (placedCoord) {
        return '<div class="modal-target-card">' +
          '<div class="name">Нов хидрант</div>' +
          '<div>Поставена локация (lon, lat): ' + placedCoord[0].toFixed(6) + ', ' + placedCoord[1].toFixed(6) + '</div>' +
        '</div>';
      }
      return '<div class="modal-target-card"><div class="name">Нов хидрант</div></div>';
    }
    if (!hydrant) return '';
    const typeLabel = hydrantTypeLabel(hydrant.type);
    return '<div class="modal-target-card">' +
      '<div class="name">' + escapeHtml(hydrant.address || ('Хидрант ' + hydrant.id)) + '</div>' +
      '<div>ID: ' + escapeHtml(hydrant.id) +
        (hydrant.region ? ' · ' + escapeHtml(hydrant.region) : '') + '</div>' +
      (typeLabel ? '<div>Тип: ' + typeLabel + '</div>' : '') +
      '<div>Координати в базата (lon, lat): ' + hydrant.coords[0].toFixed(6) + ', ' + hydrant.coords[1].toFixed(6) + '</div>' +
    '</div>';
  }
  function nameFieldHTML(reporter) {
    return '<div class="field" id="fld_reporter">' +
      '<label>Твоето име или handle <span class="req">*</span></label>' +
      '<input type="text" data-field="reporter" maxlength="' + MAX_NAME_LEN + '" value="' + escapeHtml(reporter || '') + '" placeholder="напр. Иван (доброволец)">' +
      '<div class="err">Името трябва да е между ' + MIN_NAME_LEN + ' и ' + MAX_NAME_LEN + ' символа.</div>' +
    '</div>';
  }
  function radioRowHTML(field, options, selected) {
    return '<div class="radio-row" data-radio="' + field + '">' +
      options.map(o =>
        '<button type="button" class="radio-chip' + (o === selected ? ' selected' : '') + '" data-val="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>'
      ).join('') +
    '</div>';
  }
  function typeFieldsHTML(t, d) {
    if (t === 'exists_confirmed') {
      // Hide pickers whose target field is already populated on the hydrant
      // record. With both fields populated, the modal collapses back to its
      // original reporter + free-text friction level.
      const h = d.hydrant;
      const showTypePicker = !(h && h.type);
      const showOpPicker   = !(h && h.operational_status);
      let html = '';
      if (showTypePicker) {
        html += '<div class="field" id="fld_hydrant_type">' +
          '<label>Тип хидрант <span class="req">*</span></label>' +
          radioRowHTML('hydrant_type', ['надземен','подземен','не знам'], d.hydrant_type) +
          '<div class="err">Моля избери тип.</div>' +
        '</div>';
      }
      if (showOpPicker) {
        html += '<div class="field" id="fld_operational">' +
          '<label>Работи ли? <span class="req">*</span></label>' +
          radioRowHTML('operational', ['да','не','не съм проверявал'], d.operational) +
          '<div class="err">Моля избери дали работи.</div>' +
        '</div>';
      }
      html += '<div class="field">' +
        '<label>Свободен текст (опционално)</label>' +
        '<textarea data-field="free_text" maxlength="2000">' + escapeHtml(d.free_text) + '</textarea>' +
      '</div>';
      return html;
    }
    if (t === 'missing') {
      return '<div class="field">' +
        '<label>Какъв тип хидрант би трябвало да е тук?</label>' +
        radioRowHTML('hydrant_type_at_location', ['надземен','подземен','не знам'], d.hydrant_type_at_location) +
      '</div>' +
      '<div class="field">' +
        '<label>Описание на терена (опционално)</label>' +
        '<textarea data-field="terrain_description" maxlength="2000">' + escapeHtml(d.terrain_description) + '</textarea>' +
      '</div>';
    }
    if (t === 'new_hydrant') {
      return '<div class="field" id="fld_hydrant_type">' +
        '<label>Тип хидрант <span class="req">*</span></label>' +
        radioRowHTML('hydrant_type', ['надземен','подземен','не знам'], d.hydrant_type) +
        '<div class="err">Моля избери тип.</div>' +
      '</div>' +
      '<div class="field" id="fld_operational">' +
        '<label>Работи ли? <span class="req">*</span></label>' +
        radioRowHTML('operational', ['да','не','не съм проверявал'], d.operational) +
        '<div class="err">Моля избери дали работи.</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>Описание (опционално)</label>' +
        '<textarea data-field="description" maxlength="2000">' + escapeHtml(d.description) + '</textarea>' +
      '</div>';
    }
    if (t === 'wrong_location') {
      return '<div class="field" id="fld_description">' +
        '<label>Описание <span class="req">*</span></label>' +
        '<textarea data-field="description" maxlength="2000" placeholder="Защо локацията в базата е грешна; къде всъщност е хидрантът">' + escapeHtml(d.description) + '</textarea>' +
        '<div class="err">Моля въведи описание.</div>' +
      '</div>';
    }
    if (t === 'damaged') {
      return '<div class="field" id="fld_damage">' +
        '<label>Описание на повредата <span class="req">*</span></label>' +
        '<textarea data-field="damage_description" maxlength="2000" placeholder="Какво точно е повредено">' + escapeHtml(d.damage_description) + '</textarea>' +
        '<div class="err">Моля опиши повредата.</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>Работи ли?</label>' +
        radioRowHTML('operational', ['да','не','не съм проверявал'], d.operational) +
      '</div>';
    }
    return '';
  }
  function locationFieldHTML(t, placedCoord) {
    if (t !== 'new_hydrant' && t !== 'wrong_location') return '';
    const label = t === 'new_hydrant' ? 'Локация на нов хидрант' : 'Реална локация';
    return '<div class="field" id="fld_location">' +
      '<label>' + label + ' <span class="req">*</span></label>' +
      (placedCoord
        ? '<div class="placement-summary">[' + placedCoord[0].toFixed(6) + ', ' + placedCoord[1].toFixed(6) + '] (lon, lat)</div>'
        : '<div class="placement-summary" style="color:#c41e3a;">Няма поставена локация.</div>'
      ) +
      '<button type="button" class="placement-link" data-act="place">' +
        (placedCoord ? 'Промени локация' : 'Постави локация на картата') +
      '</button>' +
      '<div class="err">Постави локация преди изпращане.</div>' +
    '</div>';
  }

  function showReportModal(hydrant, reportType, draft) {
    draft = draft || {};
    reportDraft = {
      hydrant: hydrant || null,
      type: reportType,
      reporter: draft.reporter != null ? draft.reporter : (getReporterName() || ''),
      free_text: draft.free_text || '',
      description: draft.description || '',
      terrain_description: draft.terrain_description || '',
      damage_description: draft.damage_description || '',
      // hydrant_type and operational require explicit selection in
      // exists_confirmed (when visible) and new_hydrant. Default to empty so
      // no chip is pre-selected and submit validation forces a choice. The
      // damaged and missing flows keep their existing default selections.
      hydrant_type: draft.hydrant_type != null ? draft.hydrant_type : '',
      hydrant_type_at_location: draft.hydrant_type_at_location || 'не знам',
      operational: draft.operational != null
        ? draft.operational
        : (reportType === 'damaged' ? 'не съм проверявал' : ''),
      placedCoord: draft.placedCoord || null,
    };

    openModal(modalTitleForType(reportType));
    modalBody.innerHTML =
      reporterBarHTML(reportDraft.reporter) +
      targetCardHTML(reportType, hydrant, reportDraft.placedCoord) +
      nameFieldHTML(reportDraft.reporter) +
      typeFieldsHTML(reportType, reportDraft) +
      locationFieldHTML(reportType, reportDraft.placedCoord) +
      '<input type="text" class="honeypot" name="website" id="hp_website" tabindex="-1" autocomplete="off" aria-hidden="true">';
    modalFooter.innerHTML =
      '<button class="modal-btn cancel" data-act="cancel">Отказ</button>' +
      '<button class="modal-btn submit"  data-act="submit">Изпрати ▶</button>';

    wireReporterBar();
    wireFormHandlers(reportType);
  }

  function readDraftFromForm() {
    if (!reportDraft) return;
    const get = (f) => {
      const el = modalBody.querySelector('[data-field="' + f + '"]');
      return el ? el.value : null;
    };
    const radio = (f) => {
      const sel = modalBody.querySelector('[data-radio="' + f + '"] .radio-chip.selected');
      return sel ? sel.dataset.val : null;
    };
    reportDraft.reporter = (get('reporter') || '').trim();
    reportDraft.free_text = (get('free_text') || '').trim();
    reportDraft.description = (get('description') || '').trim();
    reportDraft.terrain_description = (get('terrain_description') || '').trim();
    reportDraft.damage_description = (get('damage_description') || '').trim();
    const ht = radio('hydrant_type'); if (ht) reportDraft.hydrant_type = ht;
    const htl = radio('hydrant_type_at_location'); if (htl) reportDraft.hydrant_type_at_location = htl;
    const op = radio('operational'); if (op) reportDraft.operational = op;
    const hp = modalBody.querySelector('#hp_website');
    reportDraft._honeypot = hp ? hp.value : '';
  }

  function wireFormHandlers(reportType) {
    modalBody.querySelectorAll('.radio-chip').forEach(c => {
      c.addEventListener('click', () => {
        const row = c.parentElement;
        row.querySelectorAll('.radio-chip').forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
      });
    });
    const placeBtn = modalBody.querySelector('[data-act="place"]');
    if (placeBtn) {
      placeBtn.addEventListener('click', () => {
        readDraftFromForm();
        const draftCopy = Object.assign({}, reportDraft);
        const hydrant = reportDraft.hydrant;
        const initialCoord = reportDraft.placedCoord ||
          (hydrant && hydrant.coords ? [hydrant.coords[0], hydrant.coords[1]] : null);
        modalBackdrop.classList.remove('show');
        enterLocationPlacementMode(initialCoord, (coord) => {
          if (coord) draftCopy.placedCoord = coord;
          showReportModal(hydrant, reportType, draftCopy);
        });
      });
    }
    modalFooter.querySelector('[data-act="cancel"]').addEventListener('click', closeReportModal);
    modalFooter.querySelector('[data-act="submit"]').addEventListener('click', () => {
      onSubmitClicked(reportType);
    });
  }

  function onSubmitClicked(reportType) {
    if (!reportDraft) return;
    readDraftFromForm();

    if (reportDraft._honeypot) { closeReportModal(); return; }

    let invalid = false;
    modalBody.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));

    const r = reportDraft.reporter;
    if (!r || r.length < MIN_NAME_LEN || r.length > MAX_NAME_LEN) {
      const f = document.getElementById('fld_reporter'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if (reportType === 'wrong_location' && !reportDraft.description) {
      const f = document.getElementById('fld_description'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if (reportType === 'damaged' && !reportDraft.damage_description) {
      const f = document.getElementById('fld_damage'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if ((reportType === 'wrong_location' || reportType === 'new_hydrant') && !reportDraft.placedCoord) {
      const f = document.getElementById('fld_location'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    // new_hydrant always requires explicit type and operational selection.
    if (reportType === 'new_hydrant') {
      if (!reportDraft.hydrant_type) {
        const f = document.getElementById('fld_hydrant_type'); if (f) f.classList.add('invalid');
        invalid = true;
      }
      if (!reportDraft.operational) {
        const f = document.getElementById('fld_operational'); if (f) f.classList.add('invalid');
        invalid = true;
      }
    }
    // exists_confirmed: validation applies only to whichever pickers are
    // visible (which is decided by whether the target hydrant already has
    // those fields populated). Opt-out picker values are valid choices.
    if (reportType === 'exists_confirmed') {
      const h = reportDraft.hydrant;
      const typeVisible = !(h && h.type);
      const opVisible   = !(h && h.operational_status);
      if (typeVisible && !reportDraft.hydrant_type) {
        const f = document.getElementById('fld_hydrant_type'); if (f) f.classList.add('invalid');
        invalid = true;
      }
      if (opVisible && !reportDraft.operational) {
        const f = document.getElementById('fld_operational'); if (f) f.classList.add('invalid');
        invalid = true;
      }
    }
    if (invalid) {
      flashStatus('Моля попълни задължителните полета', 3000);
      return;
    }

    const now = Date.now();
    if (now - lastSubmitTs < SUBMIT_THROTTLE_MS) {
      const sec = Math.ceil((SUBMIT_THROTTLE_MS - (now - lastSubmitTs)) / 1000);
      flashStatus('Изчакай ' + sec + ' сек преди следващ доклад', 3000);
      return;
    }

    const report = buildReportObject(reportType);
    const hash = dedupHash(report);
    pruneDedup(now);
    if (dedupMap.has(hash)) {
      if (!window.confirm('Вече изпратен същия доклад. Изпрати все пак?')) return;
    }

    setReporterName(report.reporter);
    lastSubmitTs = now;
    dedupMap.set(hash, now);
    submitReport(report);
  }

  function buildReportObject(reportType) {
    const d = reportDraft;
    const h = d.hydrant;
    const expected = h ? [Number(h.coords[0]), Number(h.coords[1])] : null;
    const placed = d.placedCoord
      ? [Number(d.placedCoord[0].toFixed(6)), Number(d.placedCoord[1].toFixed(6))]
      : null;
    const location_method = (reportType === 'new_hydrant' || reportType === 'wrong_location')
      ? 'manual_placement'
      : 'hydrant_ref';
    return {
      report_id: uuidv4(),
      report_type: reportType,
      timestamp: localISOString(),
      reporter: d.reporter,
      hydrant_ref: h ? h.id : null,
      expected_coord: expected,
      reported_coord: placed,
      location_method: location_method,
      app_version: APP_VERSION,
      free_text: reportType === 'exists_confirmed' && d.free_text ? d.free_text : null,
      terrain_description: reportType === 'missing' && d.terrain_description ? d.terrain_description : null,
      description: ((reportType === 'wrong_location' || reportType === 'new_hydrant') && d.description) ? d.description : null,
      damage_description: reportType === 'damaged' && d.damage_description ? d.damage_description : null,
      hydrant_type_at_location: reportType === 'missing' ? d.hydrant_type_at_location : null,
      // Canonical fields per Section B of
      // docs/audits/backfill_and_submission_extension_plan_20260509.md.
      // Legacy keys (hydrant_type / operational) are deliberately not emitted
      // — the Worker still accepts them on inbound parsing for backward
      // compat with old issues, but new submissions are canonical-only.
      type:
        (reportType === 'exists_confirmed' || reportType === 'new_hydrant')
          ? canonicalTypeFromPicker(d.hydrant_type)
          : null,
      operational_status:
        (reportType === 'exists_confirmed' || reportType === 'new_hydrant' || reportType === 'damaged')
          ? canonicalOperationalFromPicker(d.operational)
          : null,
    };
  }

  function dedupHash(report) {
    const coord = report.reported_coord ? report.reported_coord.join(',') : '';
    return [report.report_type, report.hydrant_ref || '', report.reporter || '', coord].join('|');
  }
  function pruneDedup(now) {
    for (const [k, ts] of dedupMap.entries()) {
      if (now - ts > DEDUP_WINDOW_MS) dedupMap.delete(k);
    }
  }

  // ----- YAML / Markdown / Title -----
  function buildIssueTitle(report) {
    if (report.report_type === 'new_hydrant' && report.reported_coord) {
      return '[new_hydrant] @' +
        report.reported_coord[1].toFixed(6) + ',' + report.reported_coord[0].toFixed(6);
    }
    return '[' + report.report_type + '] ' + (report.hydrant_ref || 'unknown');
  }
  function yamlValue(v) {
    if (v === null || v === undefined) return 'null';
    if (Array.isArray(v)) {
      return '[' + v.map(x => (typeof x === 'number') ? String(x) : yamlValue(x)).join(', ') + ']';
    }
    if (typeof v === 'number') return String(v);
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return JSON.stringify(String(v));
  }
  function buildReportYAML(report) {
    const order = [
      'report_id','report_type','timestamp','reporter','hydrant_ref',
      'expected_coord','reported_coord','location_method','app_version',
      'free_text','terrain_description','description','damage_description',
      'hydrant_type_at_location','type','operational_status'
    ];
    const lines = ['---'];
    for (const k of order) lines.push(k + ': ' + yamlValue(report[k]));
    lines.push('---');
    return lines.join('\n');
  }
  function buildIssueBody(report) {
    const yaml = buildReportYAML(report);
    const typeNames = {
      exists_confirmed: 'Хидрантът е там',
      missing: 'Хидрант липсва',
      wrong_location: 'Грешна локация',
      damaged: 'Повреден',
      new_hydrant: 'Нов хидрант',
    };
    const md = [];
    md.push('## Доклад');
    md.push('');
    md.push('**Тип:** ' + (typeNames[report.report_type] || report.report_type));
    md.push('**Подател:** ' + report.reporter);
    md.push('**Време:** ' + report.timestamp);
    if (report.hydrant_ref) md.push('**Хидрант ID:** ' + report.hydrant_ref);
    if (report.expected_coord) {
      md.push('**Координати в базата (lon, lat):** [' +
        report.expected_coord[0] + ', ' + report.expected_coord[1] + ']');
    }
    if (report.reported_coord) {
      md.push('**Поставена локация (lon, lat):** [' +
        report.reported_coord[0] + ', ' + report.reported_coord[1] + ']');
      const lat = report.reported_coord[1], lon = report.reported_coord[0];
      md.push('**Карта:** https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon);
    } else if (report.expected_coord) {
      const lat = report.expected_coord[1], lon = report.expected_coord[0];
      md.push('**Карта:** https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon);
    }
    if (report.free_text)            { md.push(''); md.push('**Бележка:**'); md.push('> ' + report.free_text.replace(/\n/g, '\n> ')); }
    if (report.description)          { md.push(''); md.push('**Описание:**'); md.push('> ' + report.description.replace(/\n/g, '\n> ')); }
    if (report.terrain_description)  { md.push(''); md.push('**Терен:**');     md.push('> ' + report.terrain_description.replace(/\n/g, '\n> ')); }
    if (report.damage_description)   { md.push(''); md.push('**Повреда:**');   md.push('> ' + report.damage_description.replace(/\n/g, '\n> ')); }
    if (report.type)                      md.push('**Тип хидрант:** ' + (hydrantTypeLabel(report.type) || report.type));
    if (report.hydrant_type_at_location)  md.push('**Очакван тип на място:** ' + report.hydrant_type_at_location);
    if (report.operational_status)        md.push('**Работи:** ' + (OPERATIONAL_LABELS[report.operational_status] || report.operational_status));
    md.push('');
    md.push('— App: ' + report.app_version);
    return yaml + '\n\n' + md.join('\n');
  }
  function labelsForType(t) {
    const m = {
      exists_confirmed: 'exists-confirmed',
      missing: 'missing',
      wrong_location: 'wrong-location',
      damaged: 'damaged',
      new_hydrant: 'new-hydrant',
    };
    return ['report', m[t] || t.replace(/_/g, '-'), 'pending-review'];
  }

  // ----- Submission -----
  function isPlaceholderConfig() {
    return /^<TODO_/.test(GITHUB_REPO_OWNER) || !WORKER_URL;
  }
  function postIssue(url, payload, retryWithoutLabels) {
    const body = retryWithoutLabels
      ? Object.assign({}, payload, { labels: undefined })
      : payload;
    const headers = {
      'Content-Type': 'application/json',
    };
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
      .then(resp => resp.json()
        .then(j => ({ status: resp.status, json: j }))
        .catch(() => ({ status: resp.status, json: null })))
      .catch(err => ({ status: 0, json: null, networkError: (err && err.message) || 'network' }));
  }
  function submitReport(report) {
    const url = WORKER_URL;
    const payload = {
      title: buildIssueTitle(report),
      body: buildIssueBody(report),
      labels: labelsForType(report.report_type),
    };
    if (isPlaceholderConfig()) {
      flashStatus('Системата още не е конфигурирана. Свържи се с Петър.', 5000);
      queueReport(report);
      closeReportModal();
      return;
    }
    postIssue(url, payload, false).then(res => handleSubmitResult(res, report, url, payload));
  }
  function handleSubmitResult(res, report, url, payload) {
    if (res.status === 201) {
      const num = res.json && res.json.number;
      flashStatus('Докладът е изпратен. Референтен номер: #' + num + '. Благодаря!', 5000);
      storeRecentReport(report, num);
      closeReportModal();
      return;
    }
    if (res.status === 401) {
      console.error('[report] 401 unauthorized', res.json);
      flashStatus('Системна грешка. Свържи се с администратор.', 5000);
      return;
    }
    if (res.status === 403) {
      console.warn('[report] 403 rate/secondary limit', res.json);
      flashStatus('Твърде много доклади. Опитай след 1 час.', 5000);
      queueReport(report);
      return;
    }
    if (res.status === 404 || res.status === 410) {
      console.error('[report] ' + res.status + ' repo missing', res.json);
      flashStatus('Системна грешка. Свържи се с администратор.', 5000);
      return;
    }
    if (res.status === 422) {
      const msg = res.json && (res.json.message || (res.json.errors && JSON.stringify(res.json.errors)));
      console.warn('[report] 422', msg);
      if (msg && /label/i.test(msg)) {
        postIssue(url, payload, true).then(res2 => {
          if (res2.status === 201) {
            const num = res2.json && res2.json.number;
            flashStatus('Докладът е изпратен (#' + num + '). Етикетите още не са създадени — кажи на администратор.', 6000);
            storeRecentReport(report, num);
            closeReportModal();
          } else {
            flashStatus('Системна грешка ' + res2.status + '. Кажи на администратор.', 5000);
          }
        });
        return;
      }
      flashStatus('Системна грешка 422. Кажи на администратор.', 5000);
      return;
    }
    if (res.status === 0 || res.status === 503 || res.status === 400) {
      console.warn('[report] transient', res);
      if (window.confirm('Няма интернет. Запази локално и опитай пак?')) {
        queueReport(report);
        flashStatus('Запазен локално. Ще опитаме пак при връзка.', 4000);
        closeReportModal();
      }
      return;
    }
    console.error('[report] unexpected', res);
    flashStatus('Системна грешка ' + res.status + '. Кажи на администратор.', 5000);
  }
  function storeRecentReport(report, issueNumber) {
    let arr = lsGet(LS_RECENT, []);
    arr.unshift({ issue_number: issueNumber, report: report, ts: Date.now() });
    if (arr.length > 50) arr = arr.slice(0, 50);
    lsSet(LS_RECENT, arr);
  }
  function queueReport(report) {
    const arr = lsGet(LS_PENDING, []);
    arr.push({ report: report, queued_at: Date.now() });
    lsSet(LS_PENDING, arr);
  }
  function retryQueuedReports() {
    if (isPlaceholderConfig()) return;
    const arr = lsGet(LS_PENDING, []);
    if (!arr.length) return;
    const remaining = [];
    let processed = 0;
    function next(i) {
      if (i >= arr.length) {
        lsSet(LS_PENDING, remaining);
        if (processed > 0) flashStatus('Изпратени ' + processed + ' изчакващ(и) доклад(а)', 4000);
        return;
      }
      const item = arr[i];
      const url = WORKER_URL;
      const payload = {
        title: buildIssueTitle(item.report),
        body: buildIssueBody(item.report),
        labels: labelsForType(item.report.report_type),
      };
      postIssue(url, payload, false).then(res => {
        if (res.status === 201) {
          processed++;
          storeRecentReport(item.report, res.json && res.json.number);
        } else if (res.status === 0 || res.status === 503 || res.status === 403) {
          remaining.push(item);
        } else {
          console.warn('[report] queue drop', res.status, item);
        }
        next(i + 1);
      });
    }
    next(0);
  }

  function setPlacementMarker(latlng) {
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }
    const icon = L.divIcon({
      className: 'placement-marker',
      html: '<div class="placement-pin"></div>',
      iconSize: [44, 44], iconAnchor: [22, 36]
    });
    placementMarker = L.marker(latlng, { icon: icon, draggable: true, zIndexOffset: 2000 }).addTo(map);
    placementMarker.on('dragend', (ev) => {

      placementClearBtn.disabled = false;

  function clearPlacementMarker() {
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }

  function onMapContextMenu(e) {

  function onMapTouchStart(e) {
    if (!placementActive) return;
    if (!e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    pendingTouchStart = { x: t.clientX, y: t.clientY };
    clearTimeout(pendingTouchTimer);
    pendingTouchTimer = setTimeout(() => {
      if (!placementActive || !pendingTouchStart) return;
      const rect = map.getContainer().getBoundingClientRect();
      const px = pendingTouchStart.x - rect.left;
      const py = pendingTouchStart.y - rect.top;
      const ll = map.containerPointToLatLng([px, py]);
      setPlacementMarker(ll);
      pendingTouchStart = null;
    }, 500);
  }
  function onMapTouchMove(e) {
    if (!pendingTouchStart || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - pendingTouchStart.x;
    const dy = t.clientY - pendingTouchStart.y;
    if (dx*dx + dy*dy > 144) {
      clearTimeout(pendingTouchTimer);
      pendingTouchTimer = null;
      pendingTouchStart = null;
    }
  }
  function onMapTouchEnd() {
    clearTimeout(pendingTouchTimer);
    pendingTouchTimer = null;
    pendingTouchStart = null;
  }

  function enterLocationPlacementMode(initialCoord, callback, opts) {
    opts = opts || {};
    const showAsReference = !!opts.showAsReference;
    placementActive = true;
    placementDoneCb = (typeof callback === 'function') ? callback : null;
    clearPlacementMarker();
    if (placementRefMarker) { map.removeLayer(placementRefMarker); placementRefMarker = null; }
    placementBanner.hidden = false;
    placementActionsEl.hidden = false;
    placementConfirmBtn.disabled = true;
    placementClearBtn.disabled = true;
    if (initialCoord) {
      const ll = L.latLng(initialCoord[1], initialCoord[0]);
      if (showAsReference) {
        // Show DB coord as a non-interactive visual reference. The user must
        // explicitly tap/long-press/drag elsewhere to place the actual pin —

        const refIcon = L.divIcon({
          className: 'placement-ref-marker',
          html: '<div class="placement-db-ref"></div>',
          iconSize: [28, 28], iconAnchor: [14, 28]

      } else {

    map.on('contextmenu', onMapContextMenu);
    const c = map.getContainer();
    c.addEventListener('touchstart',  onMapTouchStart, { passive: true });
    c.addEventListener('touchmove',   onMapTouchMove,  { passive: true });
    c.addEventListener('touchend',    onMapTouchEnd,   { passive: true });
    c.addEventListener('touchcancel', onMapTouchEnd,   { passive: true });
  }

    placementActive = false;
    placementBanner.hidden = true;
    placementActionsEl.hidden = true;
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }
    if (placementRefMarker) { map.removeLayer(placementRefMarker); placementRefMarker = null; }
    map.off('contextmenu', onMapContextMenu);

    c.removeEventListener('touchstart',  onMapTouchStart);
    c.removeEventListener('touchmove',   onMapTouchMove);
    c.removeEventListener('touchend',    onMapTouchEnd);
    c.removeEventListener('touchcancel', onMapTouchEnd);
    const cb = placementDoneCb; placementDoneCb = null;
    if (cb) cb(coord);
  }
  placementClearBtn.addEventListener('click', clearPlacementMarker);
