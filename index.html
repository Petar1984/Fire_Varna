      '<button class="modal-btn cancel" data-act="cancel">Отказ</button>';
    wireReporterBar();
    modalBody.querySelectorAll('.type-btn').forEach(b => {
      b.addEventListener('click', () => {
        const t = b.dataset.type;
        if (hydrant) {
          if (t === 'wrong_location') {
            closeReportModal();
            beginWrongLocationPlacement(hydrant);
            return;
          }
          showReportModal(hydrant, t);
          return;
        }
        // No-hydrant context (global "+" entry).
        if (t === 'new_hydrant') {
          closeReportModal();
          const draft = { reporter: getReporterName() || '' };
          enterLocationPlacementMode(lastFix ? [lastFix.lon, lastFix.lat] : null, (coord) => {
            if (!coord) return;
            draft.placedCoord = coord;
            showReportModal(null, 'new_hydrant', draft);
          });
        } else {
          // Pre-pick: remember the chosen type, show banner, wait for the
          // user's next hydrant tap to consume and route into the flow.
          closeReportModal();
          showPrepickBanner(t);
        }
      });
    });
    modalFooter.querySelector('[data-act="cancel"]').addEventListener('click', closeReportModal);
  }

  // ----- Report form (per type) -----
  function modalTitleForType(t) {
    switch (t) {
      case 'exists_confirmed': return '✓ Хидрантът е там';
      case 'missing':          return '✗ Хидрант липсва';
      case 'wrong_location':   return '⚠ Грешна локация';
      case 'damaged':          return '⚠ Повреден';
      case 'new_hydrant':      return '➕ Нов хидрант';
      default:                 return '🚨 Сигнал за хидрант';
    }
  }
  function hydrantTypeLabel(hydrant) {
    if (!hydrant || hydrant.t == null) return '';
    const raw = String(hydrant.t).trim().toLowerCase();
    if (raw === 'underground' || raw.includes('подземен')) return 'Подземен';
    if (raw === 'ground' || raw.includes('надземен')) return 'Надземен';
    return '';
  }
  function targetCardHTML(reportType, hydrant, placedCoord) {
    if (reportType === 'new_hydrant') {
      if (placedCoord) {
        return '<div class="modal-target-card">' +
          '<div class="name">Нов хидрант</div>' +
          '<div>Поставена локация (lon, lat): ' + placedCoord[0].toFixed(6) + ', ' + placedCoord[1].toFixed(6) + '</div>' +
        '</div>';
      }
      return '<div class="modal-target-card"><div class="name">Нов хидрант</div></div>';
    }
    if (!hydrant) return '';
    const typeLabel = hydrantTypeLabel(hydrant);
    return '<div class="modal-target-card">' +
      '<div class="name">' + escapeHtml(hydrant.a || ('Хидрант ' + hydrant.i)) + '</div>' +
      '<div>ID: ' + escapeHtml(hydrant.i) + ' · ' + escapeHtml(hydrant.s) +
        (hydrant.r ? ' · ' + escapeHtml(hydrant.r) : '') + '</div>' +
      (typeLabel ? '<div>Тип: ' + typeLabel + '</div>' : '') +
      '<div>Координати в базата (lon, lat): ' + hydrant.c[0].toFixed(6) + ', ' + hydrant.c[1].toFixed(6) + '</div>' +
    '</div>';
  }
  function nameFieldHTML(reporter) {
    return '<div class="field" id="fld_reporter">' +
      '<label>Твоето име или handle <span class="req">*</span></label>' +
      '<input type="text" data-field="reporter" maxlength="' + MAX_NAME_LEN + '" value="' + escapeHtml(reporter || '') + '" placeholder="напр. Иван (доброволец)">' +
      '<div class="err">Името трябва да е между ' + MIN_NAME_LEN + ' и ' + MAX_NAME_LEN + ' символа.</div>' +
    '</div>';
  }
  function radioRowHTML(field, options, selected) {
    return '<div class="radio-row" data-radio="' + field + '">' +
      options.map(o =>
        '<button type="button" class="radio-chip' + (o === selected ? ' selected' : '') + '" data-val="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>'
      ).join('') +
    '</div>';
  }
  function typeFieldsHTML(t, d) {
    if (t === 'exists_confirmed') {
      return '<div class="field">' +
        '<label>Свободен текст (опционално)</label>' +
        '<textarea data-field="free_text" maxlength="2000">' + escapeHtml(d.free_text) + '</textarea>' +
      '</div>';
    }
    if (t === 'missing') {
      return '<div class="field">' +
        '<label>Какъв тип хидрант би трябвало да е тук?</label>' +
        radioRowHTML('hydrant_type_at_location', ['надземен','подземен','не знам'], d.hydrant_type_at_location) +
      '</div>' +
      '<div class="field">' +
        '<label>Описание на терена (опционално)</label>' +
        '<textarea data-field="terrain_description" maxlength="2000">' + escapeHtml(d.terrain_description) + '</textarea>' +
      '</div>';
    }
    if (t === 'new_hydrant') {
      return '<div class="field">' +
        '<label>Тип хидрант</label>' +
        radioRowHTML('hydrant_type', ['надземен','подземен','не знам'], d.hydrant_type) +
      '</div>' +
      '<div class="field">' +
        '<label>Описание (опционално)</label>' +
        '<textarea data-field="description" maxlength="2000">' + escapeHtml(d.description) + '</textarea>' +
      '</div>';
    }
    if (t === 'wrong_location') {
      return '<div class="field" id="fld_description">' +
        '<label>Описание <span class="req">*</span></label>' +
        '<textarea data-field="description" maxlength="2000" placeholder="Защо локацията в базата е грешна; къде всъщност е хидрантът">' + escapeHtml(d.description) + '</textarea>' +
        '<div class="err">Моля въведи описание.</div>' +
      '</div>';
    }
    if (t === 'damaged') {
      return '<div class="field" id="fld_damage">' +
        '<label>Описание на повредата <span class="req">*</span></label>' +
        '<textarea data-field="damage_description" maxlength="2000" placeholder="Какво точно е повредено">' + escapeHtml(d.damage_description) + '</textarea>' +
        '<div class="err">Моля опиши повредата.</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>Работи ли?</label>' +
        radioRowHTML('operational', ['да','не','не съм проверявал, само видимо'], d.operational) +
      '</div>';
    }
    return '';
  }
  function locationFieldHTML(t, placedCoord) {
    if (t !== 'new_hydrant' && t !== 'wrong_location') return '';
    const label = t === 'new_hydrant' ? 'Локация на нов хидрант' : 'Реална локация';
    return '<div class="field" id="fld_location">' +
      '<label>' + label + ' <span class="req">*</span></label>' +
      (placedCoord
        ? '<div class="placement-summary">[' + placedCoord[0].toFixed(6) + ', ' + placedCoord[1].toFixed(6) + '] (lon, lat)</div>'
        : '<div class="placement-summary" style="color:#c41e3a;">Няма поставена локация.</div>'
      ) +
      '<button type="button" class="placement-link" data-act="place">' +
        (placedCoord ? 'Промени локация' : 'Постави локация на картата') +
      '</button>' +
      '<div class="err">Постави локация преди изпращане.</div>' +
    '</div>';
  }

  function showReportModal(hydrant, reportType, draft) {
    draft = draft || {};
    reportDraft = {
      hydrant: hydrant || null,
      type: reportType,
      reporter: draft.reporter != null ? draft.reporter : (getReporterName() || ''),
      free_text: draft.free_text || '',
      description: draft.description || '',
      terrain_description: draft.terrain_description || '',
      damage_description: draft.damage_description || '',
      hydrant_type: draft.hydrant_type || 'не знам',
      hydrant_type_at_location: draft.hydrant_type_at_location || 'не знам',
      operational: draft.operational || 'не съм проверявал, само видимо',
      placedCoord: draft.placedCoord || null,
    };

    openModal(modalTitleForType(reportType));
    modalBody.innerHTML =
      reporterBarHTML(reportDraft.reporter) +
      targetCardHTML(reportType, hydrant, reportDraft.placedCoord) +
      nameFieldHTML(reportDraft.reporter) +
      typeFieldsHTML(reportType, reportDraft) +
      locationFieldHTML(reportType, reportDraft.placedCoord) +
      '<input type="text" class="honeypot" name="website" id="hp_website" tabindex="-1" autocomplete="off" aria-hidden="true">';
    modalFooter.innerHTML =
      '<button class="modal-btn cancel" data-act="cancel">Отказ</button>' +
      '<button class="modal-btn submit"  data-act="submit">Изпрати ▶</button>';

    wireReporterBar();
    wireFormHandlers(reportType);
  }

  function readDraftFromForm() {
    if (!reportDraft) return;
    const get = (f) => {
      const el = modalBody.querySelector('[data-field="' + f + '"]');
      return el ? el.value : null;
    };
    const radio = (f) => {
      const sel = modalBody.querySelector('[data-radio="' + f + '"] .radio-chip.selected');
      return sel ? sel.dataset.val : null;
    };
    reportDraft.reporter = (get('reporter') || '').trim();
    reportDraft.free_text = (get('free_text') || '').trim();
    reportDraft.description = (get('description') || '').trim();
    reportDraft.terrain_description = (get('terrain_description') || '').trim();
    reportDraft.damage_description = (get('damage_description') || '').trim();
    const ht = radio('hydrant_type'); if (ht) reportDraft.hydrant_type = ht;
    const htl = radio('hydrant_type_at_location'); if (htl) reportDraft.hydrant_type_at_location = htl;
    const op = radio('operational'); if (op) reportDraft.operational = op;
    const hp = modalBody.querySelector('#hp_website');
    reportDraft._honeypot = hp ? hp.value : '';
  }

  function wireFormHandlers(reportType) {
    modalBody.querySelectorAll('.radio-chip').forEach(c => {
      c.addEventListener('click', () => {
        const row = c.parentElement;
        row.querySelectorAll('.radio-chip').forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
      });
    });
    const placeBtn = modalBody.querySelector('[data-act="place"]');
    if (placeBtn) {
      placeBtn.addEventListener('click', () => {
        readDraftFromForm();
        const draftCopy = Object.assign({}, reportDraft);
        const hydrant = reportDraft.hydrant;
        const initialCoord = reportDraft.placedCoord ||
          (hydrant && hydrant.c ? [hydrant.c[0], hydrant.c[1]] : null);
        modalBackdrop.classList.remove('show');
        enterLocationPlacementMode(initialCoord, (coord) => {
          if (coord) draftCopy.placedCoord = coord;
          showReportModal(hydrant, reportType, draftCopy);
        });
      });
    }
    modalFooter.querySelector('[data-act="cancel"]').addEventListener('click', closeReportModal);
    modalFooter.querySelector('[data-act="submit"]').addEventListener('click', () => {
      onSubmitClicked(reportType);
    });
  }

  function onSubmitClicked(reportType) {
    if (!reportDraft) return;
    readDraftFromForm();

    if (reportDraft._honeypot) { closeReportModal(); return; }

    let invalid = false;
    modalBody.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));

    const r = reportDraft.reporter;
    if (!r || r.length < MIN_NAME_LEN || r.length > MAX_NAME_LEN) {
      const f = document.getElementById('fld_reporter'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if (reportType === 'wrong_location' && !reportDraft.description) {
      const f = document.getElementById('fld_description'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if (reportType === 'damaged' && !reportDraft.damage_description) {
      const f = document.getElementById('fld_damage'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if ((reportType === 'wrong_location' || reportType === 'new_hydrant') && !reportDraft.placedCoord) {
      const f = document.getElementById('fld_location'); if (f) f.classList.add('invalid');
      invalid = true;
    }
    if (invalid) {
      flashStatus('Моля попълни задължителните полета', 3000);
      return;
    }

    const now = Date.now();
    if (now - lastSubmitTs < SUBMIT_THROTTLE_MS) {
      const sec = Math.ceil((SUBMIT_THROTTLE_MS - (now - lastSubmitTs)) / 1000);
      flashStatus('Изчакай ' + sec + ' сек преди следващ доклад', 3000);
      return;
    }

    const report = buildReportObject(reportType);
    const hash = dedupHash(report);
    pruneDedup(now);
    if (dedupMap.has(hash)) {
      if (!window.confirm('Вече изпратен същия доклад. Изпрати все пак?')) return;
    }

    setReporterName(report.reporter);
    lastSubmitTs = now;
    dedupMap.set(hash, now);
    submitReport(report);
  }

  function buildReportObject(reportType) {
    const d = reportDraft;
    const h = d.hydrant;
    const expected = h ? [Number(h.c[0]), Number(h.c[1])] : null;
    const placed = d.placedCoord
      ? [Number(d.placedCoord[0].toFixed(6)), Number(d.placedCoord[1].toFixed(6))]
      : null;
    const location_method = (reportType === 'new_hydrant' || reportType === 'wrong_location')
      ? 'manual_placement'
      : 'hydrant_ref';
    return {
      report_id: uuidv4(),
      report_type: reportType,
      timestamp: localISOString(),
      reporter: d.reporter,
      hydrant_ref: h ? h.i : null,
      expected_coord: expected,
      reported_coord: placed,
      location_method: location_method,
      app_version: APP_VERSION,
      free_text: reportType === 'exists_confirmed' && d.free_text ? d.free_text : null,
      terrain_description: reportType === 'missing' && d.terrain_description ? d.terrain_description : null,
      description: ((reportType === 'wrong_location' || reportType === 'new_hydrant') && d.description) ? d.description : null,
      damage_description: reportType === 'damaged' && d.damage_description ? d.damage_description : null,
      hydrant_type_at_location: reportType === 'missing' ? d.hydrant_type_at_location : null,
      hydrant_type: reportType === 'new_hydrant' ? d.hydrant_type : null,
      operational: reportType === 'damaged' ? d.operational : null,
    };
  }

  function dedupHash(report) {
    const coord = report.reported_coord ? report.reported_coord.join(',') : '';
    return [report.report_type, report.hydrant_ref || '', report.reporter || '', coord].join('|');
  }
  function pruneDedup(now) {
    for (const [k, ts] of dedupMap.entries()) {
      if (now - ts > DEDUP_WINDOW_MS) dedupMap.delete(k);
    }
  }

  // ----- YAML / Markdown / Title -----
  function buildIssueTitle(report) {
    if (report.report_type === 'new_hydrant' && report.reported_coord) {
      return '[new_hydrant] @' +
        report.reported_coord[1].toFixed(6) + ',' + report.reported_coord[0].toFixed(6);
    }
    return '[' + report.report_type + '] ' + (report.hydrant_ref || 'unknown');
  }
  function yamlValue(v) {
    if (v === null || v === undefined) return 'null';
    if (Array.isArray(v)) {
      return '[' + v.map(x => (typeof x === 'number') ? String(x) : yamlValue(x)).join(', ') + ']';
    }
    if (typeof v === 'number') return String(v);
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return JSON.stringify(String(v));
  }
  function buildReportYAML(report) {
    const order = [
      'report_id','report_type','timestamp','reporter','hydrant_ref',
      'expected_coord','reported_coord','location_method','app_version',
      'free_text','terrain_description','description','damage_description',
      'hydrant_type_at_location','hydrant_type','operational'
    ];
    const lines = ['---'];
    for (const k of order) lines.push(k + ': ' + yamlValue(report[k]));
    lines.push('---');
    return lines.join('\n');
  }
  function buildIssueBody(report) {
    const yaml = buildReportYAML(report);
    const typeNames = {
      exists_confirmed: 'Хидрантът е там',
      missing: 'Хидрант липсва',
      wrong_location: 'Грешна локация',
      damaged: 'Повреден',
      new_hydrant: 'Нов хидрант',
    };
    const md = [];
    md.push('## Доклад');
    md.push('');
    md.push('**Тип:** ' + (typeNames[report.report_type] || report.report_type));
    md.push('**Подател:** ' + report.reporter);
    md.push('**Време:** ' + report.timestamp);
    if (report.hydrant_ref) md.push('**Хидрант ID:** ' + report.hydrant_ref);
    if (report.expected_coord) {
      md.push('**Координати в базата (lon, lat):** [' +
        report.expected_coord[0] + ', ' + report.expected_coord[1] + ']');
    }
    if (report.reported_coord) {
      md.push('**Поставена локация (lon, lat):** [' +
        report.reported_coord[0] + ', ' + report.reported_coord[1] + ']');
      const lat = report.reported_coord[1], lon = report.reported_coord[0];
      md.push('**Карта:** https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon);
    } else if (report.expected_coord) {
      const lat = report.expected_coord[1], lon = report.expected_coord[0];
      md.push('**Карта:** https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon);
    }
    if (report.free_text)            { md.push(''); md.push('**Бележка:**'); md.push('> ' + report.free_text.replace(/\n/g, '\n> ')); }
    if (report.description)          { md.push(''); md.push('**Описание:**'); md.push('> ' + report.description.replace(/\n/g, '\n> ')); }
    if (report.terrain_description)  { md.push(''); md.push('**Терен:**');     md.push('> ' + report.terrain_description.replace(/\n/g, '\n> ')); }
    if (report.damage_description)   { md.push(''); md.push('**Повреда:**');   md.push('> ' + report.damage_description.replace(/\n/g, '\n> ')); }
    if (report.hydrant_type)              md.push('**Тип хидрант:** ' + report.hydrant_type);
    if (report.hydrant_type_at_location)  md.push('**Очакван тип на място:** ' + report.hydrant_type_at_location);
    if (report.operational)               md.push('**Работи:** ' + report.operational);
    md.push('');
    md.push('— App: ' + report.app_version);
    return yaml + '\n\n' + md.join('\n');
  }
  function labelsForType(t) {
    const m = {
      exists_confirmed: 'exists-confirmed',
      missing: 'missing',
      wrong_location: 'wrong-location',
      damaged: 'damaged',
      new_hydrant: 'new-hydrant',
    };
    return ['report', m[t] || t.replace(/_/g, '-'), 'pending-review'];
  }

  // ----- Submission -----
  function isPlaceholderConfig() {
    return /^<TODO_/.test(GITHUB_REPO_OWNER) || !WORKER_URL;
  }
  function postIssue(url, payload, retryWithoutLabels) {
    const body = retryWithoutLabels
      ? Object.assign({}, payload, { labels: undefined })
      : payload;
    const headers = {
      'Content-Type': 'application/json',
    };
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
      .then(resp => resp.json()
        .then(j => ({ status: resp.status, json: j }))
        .catch(() => ({ status: resp.status, json: null })))
      .catch(err => ({ status: 0, json: null, networkError: (err && err.message) || 'network' }));
  }
  function submitReport(report) {
    const url = WORKER_URL;
    const payload = {
      title: buildIssueTitle(report),
      body: buildIssueBody(report),
      labels: labelsForType(report.report_type),
    };
    if (isPlaceholderConfig()) {
      flashStatus('Системата още не е конфигурирана. Свържи се с Петър.', 5000);
      queueReport(report);
      closeReportModal();
      return;
    }
    postIssue(url, payload, false).then(res => handleSubmitResult(res, report, url, payload));
  }
  function handleSubmitResult(res, report, url, payload) {
    if (res.status === 201) {
      const num = res.json && res.json.number;
      flashStatus('Докладът е изпратен. Референтен номер: #' + num + '. Благодаря!', 5000);
      storeRecentReport(report, num);
      closeReportModal();
      return;
    }
    if (res.status === 401) {
      console.error('[report] 401 unauthorized', res.json);
      flashStatus('Системна грешка. Свържи се с администратор.', 5000);
      return;
    }
    if (res.status === 403) {
      console.warn('[report] 403 rate/secondary limit', res.json);
      flashStatus('Твърде много доклади. Опитай след 1 час.', 5000);
      queueReport(report);
      return;
    }
    if (res.status === 404 || res.status === 410) {
      console.error('[report] ' + res.status + ' repo missing', res.json);
      flashStatus('Системна грешка. Свържи се с администратор.', 5000);
      return;
    }
    if (res.status === 422) {
      const msg = res.json && (res.json.message || (res.json.errors && JSON.stringify(res.json.errors)));
      console.warn('[report] 422', msg);
      if (msg && /label/i.test(msg)) {
        postIssue(url, payload, true).then(res2 => {
          if (res2.status === 201) {
            const num = res2.json && res2.json.number;
            flashStatus('Докладът е изпратен (#' + num + '). Етикетите още не са създадени — кажи на администратор.', 6000);
            storeRecentReport(report, num);
            closeReportModal();
          } else {
            flashStatus('Системна грешка ' + res2.status + '. Кажи на администратор.', 5000);
          }
        });
        return;
      }
      flashStatus('Системна грешка 422. Кажи на администратор.', 5000);
      return;
    }
    if (res.status === 0 || res.status === 503 || res.status === 400) {
      console.warn('[report] transient', res);
      if (window.confirm('Няма интернет. Запази локално и опитай пак?')) {
        queueReport(report);
        flashStatus('Запазен локално. Ще опитаме пак при връзка.', 4000);
        closeReportModal();
      }
      return;
    }
    console.error('[report] unexpected', res);
    flashStatus('Системна грешка ' + res.status + '. Кажи на администратор.', 5000);
  }
  function storeRecentReport(report, issueNumber) {
    let arr = lsGet(LS_RECENT, []);
    arr.unshift({ issue_number: issueNumber, report: report, ts: Date.now() });
    if (arr.length > 50) arr = arr.slice(0, 50);
    lsSet(LS_RECENT, arr);
  }
  function queueReport(report) {
    const arr = lsGet(LS_PENDING, []);
    arr.push({ report: report, queued_at: Date.now() });
    lsSet(LS_PENDING, arr);
  }
  function retryQueuedReports() {
    if (isPlaceholderConfig()) return;
    const arr = lsGet(LS_PENDING, []);
    if (!arr.length) return;
    const remaining = [];
    let processed = 0;
    function next(i) {
      if (i >= arr.length) {
        lsSet(LS_PENDING, remaining);
        if (processed > 0) flashStatus('Изпратени ' + processed + ' изчакващ(и) доклад(а)', 4000);
        return;
      }
      const item = arr[i];
      const url = WORKER_URL;
      const payload = {
        title: buildIssueTitle(item.report),
        body: buildIssueBody(item.report),
        labels: labelsForType(item.report.report_type),
      };
      postIssue(url, payload, false).then(res => {
        if (res.status === 201) {
          processed++;
          storeRecentReport(item.report, res.json && res.json.number);
        } else if (res.status === 0 || res.status === 503 || res.status === 403) {
          remaining.push(item);
        } else {
          console.warn('[report] queue drop', res.status, item);
        }
        next(i + 1);
      });
    }
    next(0);
  }
  window.addEventListener('online', retryQueuedReports);

  // ----- Long-press placement mode -----
  let placementActive = false;
  let placementMarker = null;
  let placementRefMarker = null;      // non-interactive DB-coord reference (wrong_location flow)
  let placementCoord = null;          // [lon, lat]
  let placementDoneCb = null;
  let pendingTouchTimer = null;
  let pendingTouchStart = null;
  const placementBanner    = document.getElementById('placementBanner');
  const placementActionsEl = document.getElementById('placementActions');
  const placementClearBtn  = document.getElementById('placementClear');
  const placementCancelBtn = document.getElementById('placementCancel');
  const placementConfirmBtn= document.getElementById('placementConfirm');

  // ----- Pre-pick mode (global "+" → choose type → tap hydrant) -----
  // Eliminates the prior double-pick flow: user picked type at "+", got a
  // toast, tapped hydrant, was shown the same menu again. Now: pick type
  // at "+", banner appears, next hydrant tap routes directly into that
  // report's flow. Cancel button on the banner clears pending state.
  let pendingReportType = null;
  const PREPICK_LABELS = {
    exists_confirmed: 'потвърждение',
    missing:          'маркиране липсващ',
    damaged:          'докладване повреда',
    wrong_location:   'корекция на локация',
  };
  const prepickBanner     = document.getElementById('prepickBanner');
  const prepickBannerText = document.getElementById('prepickBannerText');
  const prepickCancelBtn  = document.getElementById('prepickCancel');
  function showPrepickBanner(type) {
    pendingReportType = type;
    prepickBannerText.textContent = 'Тапни хидрант за ' + (PREPICK_LABELS[type] || '');
    prepickBanner.hidden = false;
  }
  function hidePrepickBanner() {
    pendingReportType = null;
    prepickBanner.hidden = true;
  }
  prepickCancelBtn.addEventListener('click', hidePrepickBanner);

  // Routes a hydrant tap into the pending report flow. Returns true if the
  // pre-pick was consumed (caller should suppress its default tap behavior).
  function consumePrepickForHydrant(hydrant) {
    if (!pendingReportType) return false;
    if (placementActive) return false;
    const t = pendingReportType;
    hidePrepickBanner();
    if (t === 'wrong_location') {
      beginWrongLocationPlacement(hydrant);
    } else {
      showReportModal(hydrant, t);
    }
    return true;
  }

  // Extracted from showReportTypePicker so pre-pick + per-hydrant menu share it.
  function beginWrongLocationPlacement(hydrant) {
    const draft = { reporter: getReporterName() || '' };
    enterLocationPlacementMode([hydrant.c[0], hydrant.c[1]], (coord) => {
      if (!coord) return;
      draft.placedCoord = coord;
      showReportModal(hydrant, 'wrong_location', draft);
    }, { showAsReference: true });
  }

  function setPlacementMarker(latlng) {
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }
    const icon = L.divIcon({
      className: 'placement-marker',
      html: '<div class="placement-pin"></div>',
      iconSize: [44, 44], iconAnchor: [22, 36]
    });
    placementMarker = L.marker(latlng, { icon: icon, draggable: true, zIndexOffset: 2000 }).addTo(map);
    placementMarker.on('dragend', (ev) => {
      const ll = ev.target.getLatLng();
      placementCoord = [Number(ll.lng.toFixed(6)), Number(ll.lat.toFixed(6))];
      placementConfirmBtn.disabled = false;
      placementClearBtn.disabled = false;
    });
    placementCoord = [Number(latlng.lng.toFixed(6)), Number(latlng.lat.toFixed(6))];
    placementConfirmBtn.disabled = false;
    placementClearBtn.disabled = false;
  }
  function clearPlacementMarker() {
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }
    placementCoord = null;
    placementConfirmBtn.disabled = true;
    placementClearBtn.disabled = true;
  }
  function onMapContextMenu(e) {
    if (!placementActive) return;
    setPlacementMarker(e.latlng);
  }
  function onMapTouchStart(e) {
    if (!placementActive) return;
    if (!e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    pendingTouchStart = { x: t.clientX, y: t.clientY };
    clearTimeout(pendingTouchTimer);
    pendingTouchTimer = setTimeout(() => {
      if (!placementActive || !pendingTouchStart) return;
      const rect = map.getContainer().getBoundingClientRect();
      const px = pendingTouchStart.x - rect.left;
      const py = pendingTouchStart.y - rect.top;
      const ll = map.containerPointToLatLng([px, py]);
      setPlacementMarker(ll);
      pendingTouchStart = null;
    }, 500);
  }
  function onMapTouchMove(e) {
    if (!pendingTouchStart || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - pendingTouchStart.x;
    const dy = t.clientY - pendingTouchStart.y;
    if (dx*dx + dy*dy > 144) {
      clearTimeout(pendingTouchTimer);
      pendingTouchTimer = null;
      pendingTouchStart = null;
    }
  }
  function onMapTouchEnd() {
    clearTimeout(pendingTouchTimer);
    pendingTouchTimer = null;
    pendingTouchStart = null;
  }

  function enterLocationPlacementMode(initialCoord, callback, opts) {
    opts = opts || {};
    const showAsReference = !!opts.showAsReference;
    placementActive = true;
    placementDoneCb = (typeof callback === 'function') ? callback : null;
    clearPlacementMarker();
    if (placementRefMarker) { map.removeLayer(placementRefMarker); placementRefMarker = null; }
    placementBanner.hidden = false;
    placementActionsEl.hidden = false;
    placementConfirmBtn.disabled = true;
    placementClearBtn.disabled = true;
    if (initialCoord) {
      const ll = L.latLng(initialCoord[1], initialCoord[0]);
      if (showAsReference) {
        // Show DB coord as a non-interactive visual reference. The user must
        // explicitly tap/long-press/drag elsewhere to place the actual pin —
        // prevents silent no-op submissions of the unchanged coord.
        const refIcon = L.divIcon({
          className: 'placement-ref-marker',
          html: '<div class="placement-db-ref"></div>',
          iconSize: [28, 28], iconAnchor: [14, 28]
        });
        placementRefMarker = L.marker(ll, { icon: refIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
      } else {
        setPlacementMarker(ll);
      }
      map.setView(ll, Math.max(map.getZoom(), 17));
    }
    map.on('contextmenu', onMapContextMenu);
    const c = map.getContainer();
    c.addEventListener('touchstart',  onMapTouchStart, { passive: true });
    c.addEventListener('touchmove',   onMapTouchMove,  { passive: true });
    c.addEventListener('touchend',    onMapTouchEnd,   { passive: true });
    c.addEventListener('touchcancel', onMapTouchEnd,   { passive: true });
  }
  function exitLocationPlacementMode(coord) {
    placementActive = false;
    placementBanner.hidden = true;
    placementActionsEl.hidden = true;
    if (placementMarker) { map.removeLayer(placementMarker); placementMarker = null; }
    if (placementRefMarker) { map.removeLayer(placementRefMarker); placementRefMarker = null; }
    map.off('contextmenu', onMapContextMenu);
    const c = map.getContainer();
    c.removeEventListener('touchstart',  onMapTouchStart);
    c.removeEventListener('touchmove',   onMapTouchMove);
    c.removeEventListener('touchend',    onMapTouchEnd);
    c.removeEventListener('touchcancel', onMapTouchEnd);
    const cb = placementDoneCb; placementDoneCb = null;
    if (cb) cb(coord);
  }
  placementClearBtn.addEventListener('click', clearPlacementMarker);
  placementCancelBtn.addEventListener('click', () => exitLocationPlacementMode(null));
  placementConfirmBtn.addEventListener('click', () => exitLocationPlacementMode(placementCoord));

  // ----- "+" button entry point: open report-type picker -----
  document.getElementById('addHydrantBtn').addEventListener('click', () => {
    showReportTypePicker(null);
  });

  // ----- Boot: retry any queued reports from previous session -----
  retryQueuedReports();

  // ===== Manual mode =====
  let manualMode = false;
  const manualPinBtn = document.getElementById('manualPinBtn');
  function enterManualMode() {
    manualMode = true;
    manualPinBtn.classList.add('active');
    map.getContainer().style.cursor = 'crosshair';
    flashStatus('Tap върху картата за позиция', 5000);
  }
  function exitManualMode() {
    manualMode = false;
    manualPinBtn.classList.remove('active');
    map.getContainer().style.cursor = '';
  }
  manualPinBtn.addEventListener('click', () => manualMode ? exitManualMode() : enterManualMode());
  map.on('click', (e) => {
    // Placement mode wins: tap-to-place / tap-to-move the placement pin.
    if (placementActive) {
      setPlacementMarker(e.latlng);
      return;
    }
    if (!manualMode) return;
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    followMode = false;
    document.getElementById('locateBtn').classList.remove('tracking');
    lastFix = { lat: e.latlng.lat, lon: e.latlng.lng, acc: 0 };
    placeUser();
    refresh(true);
    exitManualMode();
    hidePill();
    flashStatus('Позицията е зададена ръчно');
  });

  // ===== Misc controls =====
  const locateBtn = document.getElementById('locateBtn');
  locateBtn.addEventListener('click', () => {
    if (!lastFix) {
      flashStatus('Локацията не е известна — опитвам пак');
      startTracking();
      return;
    }
    map.setView([lastFix.lat, lastFix.lon], Math.max(map.getZoom(), 17),
                { animate: true });
    followMode = true;
    locateBtn.classList.add('tracking');
    flashStatus('Следване на локацията');
  });

  // Pan map → exit follow mode
  map.on('dragstart', () => {
    if (followMode) {
      followMode = false;
      locateBtn.classList.remove('tracking');
    }
  });

  // ===== Real-time report polling (commit 16) =====
  // Polls the Worker GET /issues every 15s, merges report status into HYDRANTS_BY_ID,
  // and updates marker icons / positions in place. Never calls refresh(); never rebuilds
  // the cluster. Pauses while the tab is hidden.
  const POLL_URL = 'https://varna-hydrants-proxy.petar-dikov2019.workers.dev/issues';
  const POLL_INTERVAL_MS = 15000;
  let pollTimer = null;
  let pollInFlight = false;
  let lastPollSince = null;     // ISO string; only advanced on a successful response

  function reportTypeToStatus(reportType) {
    if (reportType === 'exists_confirmed') return 'verified';
    if (reportType === 'wrong_location')   return 'verified';
    if (reportType === 'missing')          return 'reported';
    if (reportType === 'damaged')          return 'reported';
    return null;
  }

  function refreshMarkerIconsForHydrant(h) {
    const list = markersById[h.i];
    if (!list) return;
    list.forEach(m => {
      if (m._pinKind === 'dim') {
        m.setIcon(dimPin(h));
      } else {
        m.setIcon(makePin(m._rank, h, m._isActivePin));
      }
    });
  }

  function moveMarkersForHydrant(h) {
    const list = markersById[h.i];
    if (!list) return;
    list.forEach(m => m.setLatLng([h.c[1], h.c[0]]));
  }

  function applyReports(reports) {
    if (!Array.isArray(reports) || reports.length === 0) return;
    for (const report of reports) {
      const type = report && report.report_type;
      if (!type) continue;

      if (type === 'new_hydrant' && !report.hydrant_id) {
        if (!report.id || !Array.isArray(report.coords) || report.coords.length !== 2) continue;
        if (HYDRANTS_BY_ID[report.id]) continue; // already added in a prior poll
        const h = {
          i: report.id,
          c: [Number(report.coords[0]), Number(report.coords[1])],
          o: 'field_report',
          status: 'verified'
        };
        if (!Number.isFinite(h.c[0]) || !Number.isFinite(h.c[1])) continue;
        HYDRANTS.push(h);
        HYDRANTS_BY_ID[h.i] = h;
        // Render incrementally only when the cluster layer is currently mounted.
        // In 'top'/'near' modes the new pin will appear naturally on the next refresh()
        // when ranked by distance from the user.
        if (allClusterLayer) {
          const m = L.marker([h.c[1], h.c[0]], { icon: dimPin(h) });
          m._hydrantId = h.i;
          m._pinKind = 'dim';
          m._isActivePin = false;
          (markersById[h.i] = markersById[h.i] || []).push(m);
          attachMarkerLongPress(
            m,
            () => { consumePrepickForHydrant(h); },
            () => { if (consumePrepickForHydrant(h)) return; showReportTypePicker(h); }
          );
          allClusterLayer.addLayer(m);
        }
        continue;
      }

      const id = report.hydrant_id;
      if (!id) continue;
      const h = HYDRANTS_BY_ID[id];
      if (!h) continue;

      if (type === 'wrong_location') {
        if (Array.isArray(report.coords) && report.coords.length === 2) {
          const lon = Number(report.coords[0]), lat = Number(report.coords[1]);
          if (Number.isFinite(lon) && Number.isFinite(lat)) {
            h.c = [lon, lat];
            moveMarkersForHydrant(h);
          }
        }
      }

      const newStatus = reportTypeToStatus(type);
      if (newStatus && h.status !== newStatus) {
        h.status = newStatus;
        refreshMarkerIconsForHydrant(h);
      }
    }
  }

  async function pollIssues() {
    if (pollInFlight) return;
    pollInFlight = true;
    try {
      const url = lastPollSince ? POLL_URL + '?since=' + encodeURIComponent(lastPollSince) : POLL_URL;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return;
      const body = await res.json();
      if (body && Array.isArray(body.reports)) applyReports(body.reports);
      // Only advance the cursor on a successful, parseable response.
      if (body && typeof body.cached_at === 'string') lastPollSince = body.cached_at;
    } catch (_) {
      // Silent retry on next interval — no UI flashing per spec.
    } finally {
      pollInFlight = false;
    }
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    pollTimer = setTimeout(async () => {
      await pollIssues();
      schedulePoll();
    }, POLL_INTERVAL_MS);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(pollTimer);
      pollTimer = null;
    } else {
      // Immediate catch-up poll, then resume regular cadence.
      pollIssues().finally(schedulePoll);
    }
  });

  // Kick off polling immediately, in parallel with welcome modal / GPS bootstrap.
  pollIssues().finally(schedulePoll);

  // ===== Sheet collapse/expand =====
  const sheet = document.getElementById('sheet');
  const sheetList = document.getElementById('sheetList');
  let listOpen = false;
  document.getElementById('sheetHandle').addEventListener('click', () => {
    listOpen = !listOpen;
    sheetList.classList.toggle('collapsed', !listOpen);
  });

  // ===== Helpers =====
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function formatDist(d) {
    if (d == null) return '—';
    if (d < 1000) return Math.round(d) + ' м';
    return (d/1000).toFixed(2) + ' км';
  }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  let statusTimer = null;
  function flashStatus(msg, ms) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove('show'), ms || 2500);
  }

  // ===== Welcome flow (first-launch onboarding) =====
  const WELCOME_SEEN_KEY = 'welcome_seen';
  const WELCOME_FORCE_HASH = '#welcome';
  const WELCOME_SKIP_HASH = '#skip-welcome';
  const WELCOME_COPY = [
    'Хидранти Варна — карта на пожарни хидранти за пожарникари и доброволци',
    'Разреши локация, за да видиш най-близките хидранти. Натисни и задръж pin за сигнал; + отваря избор на доклад.',
    'За нов хидрант натисни +. Постави на картата с „📍 Тук съм" (когато си до хидранта) или влечи pin-а за корекция.'
  ];
  let welcomeShownThisSession = false;

  function welcomeSeenRead() {
    try { return localStorage.getItem(WELCOME_SEEN_KEY) === '1'; }
    catch (e) { return false; }
  }
  function welcomeSeenWrite() {
    try { localStorage.setItem(WELCOME_SEEN_KEY, '1'); } catch (e) {}
  }

  function showWelcome(onDone) {
    let step = 0;
    modalEl.classList.add('welcome-mode');
    modalBackdrop.classList.add('show');

    function render() {
      const isLast = step === WELCOME_COPY.length - 1;
      const dots = WELCOME_COPY.map((_, i) =>
        '<span class="dot' + (i === step ? ' active' : '') + '"></span>').join('');
      modalBody.innerHTML =
        '<div class="welcome-flow">' +
          '<div class="welcome-progress">' + dots + '</div>' +
          '<div class="welcome-step"><div class="welcome-copy">' +
            escapeHtml(WELCOME_COPY[step]) +
          '</div></div>' +
          '<div class="welcome-actions">' +
            '<button class="welcome-btn skip" id="welcomeSkip">Скип</button>' +
            '<button class="welcome-btn next" id="welcomeNext">' +
              (isLast ? 'Готов' : 'Напред →') +
            '</button>' +
          '</div>' +
        '</div>';
      document.getElementById('welcomeSkip').addEventListener('click', finish);
      document.getElementById('welcomeNext').addEventListener('click', () => {
        if (isLast) { finish(); } else { step++; render(); }
      });
    }
    function finish() {
      welcomeSeenWrite();
      welcomeShownThisSession = true;
      modalEl.classList.remove('welcome-mode');
      modalBackdrop.classList.remove('show');
      modalBody.innerHTML = '';
      onDone();
    }
    render();
  }

  function bootApp() {
    const hash = location.hash;
    let shouldShow;
    if (hash === WELCOME_FORCE_HASH)      shouldShow = true;
    else if (hash === WELCOME_SKIP_HASH)  shouldShow = false;
    else shouldShow = !welcomeShownThisSession && !welcomeSeenRead();

    if (shouldShow) showWelcome(startTracking);
    else            startTracking();
  }

  // ===== Auto-start =====
  bootApp();
})();
</script>

</body>
</html>
