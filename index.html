  // ===== Real-time report polling (commit 16) =====
  // Polls the Worker GET /issues every 15s, merges report status into HYDRANTS_BY_ID,
  // and updates marker icons / positions in place. Never calls refresh(); never rebuilds
  // the cluster. Pauses while the tab is hidden.
  const POLL_URL = 'https://varna-hydrants-proxy.petar-dikov2019.workers.dev/issues';
  const POLL_INTERVAL_MS = 15000;
  let pollTimer = null;
  let pollInFlight = false;
  let lastPollSince = null;     // ISO string; only advanced on a successful response

  // Maps a polled report to the semantic field changes that should land on the
  // in-memory hydrant record. Returns null when the report type does not
  // change rendering. All polled submissions set review_status:'reported' so
  // the pin renders yellow until commit 4 ingest approves the report and
  // clears the flag — single moderation gate covering exists_confirmed and
  // wrong_location alongside the pre-existing yellow gate on new_hydrant /
  // missing / damaged. Canonical type and operational_status from the report
  // are merged so they are available immediately for ingest, even though the
  // yellow precedence in hydrantStatusClass hides them visually pre-approval.
  // Per Section B5 of
  // docs/audits/backfill_and_submission_extension_plan_20260509.md.
  function reportTypeToSemanticPatch(report) {
    const t = report && report.report_type;
    let patch = null;
    if (t === 'exists_confirmed') {
      patch = { existence_status: 'verified', review_status: 'reported' };
    } else if (t === 'wrong_location' || t === 'missing' || t === 'damaged') {
      patch = { review_status: 'reported' };
    } else {
      return null;
    }
    if (t === 'exists_confirmed' && report.type) {
      patch.type = report.type;
    }
    if ((t === 'exists_confirmed' || t === 'damaged') && report.operational_status) {
      patch.operational_status = report.operational_status;
    }
    return patch;
  }

  function refreshMarkerIconsForHydrant(h) {
    const list = markersById[h.id];
    if (!list) return;
    list.forEach(m => {
      if (m._pinKind === 'dim') {
        m.setIcon(dimPin(h));
      } else {
        m.setIcon(makePin(m._rank, h, m._isActivePin));
      }
    });
  }

  function moveMarkersForHydrant(h) {
    const list = markersById[h.id];
    if (!list) return;
    list.forEach(m => m.setLatLng([h.coords[1], h.coords[0]]));
  }

  // Pull the verifier's free-text note out of a normalized /issues report.
  // The Worker already collapses the four free-text fields into `comment`
  // (firstText of damage_description / description / terrain_description /
  // free_text); we fall back to the raw details only if `comment` is absent.
  // ONLY free-text is returned — never reporter, issue url/number, labels, or
  // the structured picker values (hydrant_type / operational) in details.
  function extractReportNote(report) {
    if (!report) return null;
    const d = report.details || {};
    const candidates = [
      report.comment,
      d.damage_description, d.description, d.terrain_description, d.free_text
    ];
    for (const c of candidates) {
      if (typeof c === 'string') {
        const trimmed = c.trim();
        if (trimmed) return trimmed;
      }
    }
    return null;
  }

  function applyReports(reports) {
    if (!Array.isArray(reports) || reports.length === 0) return;
    for (const report of reports) {
      const type = report && report.report_type;
      if (!type) continue;

      if (type === 'new_hydrant' && !report.hydrant_id) {
        if (!report.id || !Array.isArray(report.coords) || report.coords.length !== 2) continue;
        const reportId = String(report.id);
        const fieldId = reportId.startsWith('field_') ? reportId : 'field_' + reportId.slice(0, 8);
        // Dedupe across full UUID, derived field_<8>, canonical id, and any
        // legacy_ids alias. resolveHydrantById reads the dual index, so an old
        // canonical record that lists this report's id under legacy_ids is also
        // matched and the polled record is dropped as a duplicate.
        if (resolveHydrantById(reportId) || resolveHydrantById(fieldId)) continue;
        const h = normalizeHydrantRecord({
          id:                 reportId,
          coords:             [Number(report.coords[0]), Number(report.coords[1])],
          origin:             'field_report',
          review_status:      'reported',
          type:               report.type || null,
          operational_status: report.operational_status || null,
          legacy_ids:         reportId === fieldId ? [] : [fieldId]
        });
        if (!h) continue;
        const newNote = extractReportNote(report);
        if (newNote) h.verifier_note = newNote;
        HYDRANTS.push(h);
        indexHydrant(h);
        // Render incrementally only when the cluster layer is currently mounted.
        // In 'top'/'near' modes the new pin will appear naturally on the next refresh()
        // when ranked by distance from the user.
        if (allClusterLayer) {
          const m = L.marker([h.coords[1], h.coords[0]], { icon: dimPin(h) });
          m._hydrantId = h.id;
          m._pinKind = 'dim';
          m._isActivePin = false;
          (markersById[h.id] = markersById[h.id] || []).push(m);
          attachMarkerLongPress(
            m,
            () => selectHydrantAndOpenPopup(h, () => setActiveTargetHydrant(h)),
            () => { if (consumePrepickForHydrant(h)) return; showReportTypePicker(h); }
          );
          allClusterLayer.addLayer(m);
        }
        continue;
      }

      const id = report.hydrant_id;
      if (!id) continue;
      const h = resolveHydrantById(id);
      if (!h) continue;

      // Surface the verifier's moderated note in-memory on the matched hydrant.
      // Only set when this report carries free-text, so a structured-only
      // confirmation never wipes a note shown from an earlier report.
      const reportNote = extractReportNote(report);
      if (reportNote) h.verifier_note = reportNote;

      if (type === 'wrong_location') {
        if (Array.isArray(report.coords) && report.coords.length === 2) {
          const lon = Number(report.coords[0]), lat = Number(report.coords[1]);
          if (Number.isFinite(lon) && Number.isFinite(lat)) {
            h.coords = [lon, lat];
            moveMarkersForHydrant(h);
            // If polling moved the active hydrant, redraw the line to it without
            // refresh() — refresh() would rebuild the cluster and collapse any
            // open spiderfy. No sheet card to refresh; an open popup is anchored
            // to the hydrant's coords and shows a snapshot from open time.
            if (h.id === activeTargetId) {
              redrawActiveLine();
            }
          }
        }
      }

      const patch = reportTypeToSemanticPatch(report);
      if (patch) {
        let changed = false;
        for (const key in patch) {
          if (h[key] !== patch[key]) { h[key] = patch[key]; changed = true; }
        }
        if (changed) refreshMarkerIconsForHydrant(h);
      }
    }
  }

  async function pollIssues() {
    if (pollInFlight) return;
    pollInFlight = true;
    try {
      const url = lastPollSince ? POLL_URL + '?since=' + encodeURIComponent(lastPollSince) : POLL_URL;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return;
      const body = await res.json();
      if (body && Array.isArray(body.reports)) applyReports(body.reports);
      // Only advance the cursor on a successful, parseable response.
      if (body && typeof body.cached_at === 'string') lastPollSince = body.cached_at;
    } catch (_) {
      // Silent retry on next interval — no UI flashing per spec.
    } finally {
      pollInFlight = false;
    }
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    pollTimer = setTimeout(async () => {
      await pollIssues();
      schedulePoll();
    }, POLL_INTERVAL_MS);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(pollTimer);
      pollTimer = null;
    } else {
      // Immediate catch-up poll, then resume regular cadence.
      pollIssues().finally(schedulePoll);
    }
  });

  // Kick off polling immediately, in parallel with welcome modal / GPS bootstrap.
  pollIssues().finally(schedulePoll);

  // ===== Helpers =====
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function formatDist(d) {
    if (d == null) return '—';
    if (d < 1000) return Math.round(d) + ' м';
    return (d/1000).toFixed(2) + ' км';
  }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  let statusTimer = null;
  function flashStatus(msg, ms) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove('show'), ms || 2500);
  }

  // ===== Welcome flow (first-launch onboarding) =====
  const WELCOME_SEEN_KEY = 'welcome_seen';
  const WELCOME_FORCE_HASH = '#welcome';
  const WELCOME_SKIP_HASH = '#skip-welcome';
  const WELCOME_COPY = [
    'Хидранти Варна — карта на пожарни хидранти за пожарникари и доброволци',
    'Разреши локация, за да видиш най-близките хидранти. Натисни и задръж pin за сигнал; + отваря избор на доклад.',
    'За нов хидрант натисни +. Постави на картата с „📍 Тук съм" (когато си до хидранта) или влечи pin-а за корекция.'
  ];
  let welcomeShownThisSession = false;

  function welcomeSeenRead() {
    try { return localStorage.getItem(WELCOME_SEEN_KEY) === '1'; }
    catch (e) { return false; }
  }
  function welcomeSeenWrite() {
    try { localStorage.setItem(WELCOME_SEEN_KEY, '1'); } catch (e) {}
  }

  function showWelcome(onDone) {
    let step = 0;
    modalEl.classList.add('welcome-mode');
    modalBackdrop.classList.add('show');

    function render() {
      const isLast = step === WELCOME_COPY.length - 1;
      const dots = WELCOME_COPY.map((_, i) =>
        '<span class="dot' + (i === step ? ' active' : '') + '"></span>').join('');
      modalBody.innerHTML =
        '<div class="welcome-flow">' +
          '<div class="welcome-progress">' + dots + '</div>' +
          '<div class="welcome-step"><div class="welcome-copy">' +
            escapeHtml(WELCOME_COPY[step]) +
          '</div></div>' +
          '<div class="welcome-actions">' +
            '<button class="welcome-btn skip" id="welcomeSkip">Скип</button>' +
            '<button class="welcome-btn next" id="welcomeNext">' +
              (isLast ? 'Готов' : 'Напред →') +
            '</button>' +
          '</div>' +
        '</div>';
      document.getElementById('welcomeSkip').addEventListener('click', finish);
      document.getElementById('welcomeNext').addEventListener('click', () => {
        if (isLast) { finish(); } else { step++; render(); }
      });
    }
    function finish() {
      welcomeSeenWrite();
      welcomeShownThisSession = true;
      modalEl.classList.remove('welcome-mode');
      modalBackdrop.classList.remove('show');
      modalBody.innerHTML = '';
      onDone();
    }
    render();
  }

  function bootApp() {
    const hash = location.hash;
    let shouldShow;
    if (hash === WELCOME_FORCE_HASH)      shouldShow = true;
    else if (hash === WELCOME_SKIP_HASH)  shouldShow = false;
    else shouldShow = !welcomeShownThisSession && !welcomeSeenRead();

    if (shouldShow) showWelcome(startTracking);
    else            startTracking();
  }

  // =========================================================================
  // E3a — Public building layer (additive, isolated). Renders ONLY from the
  // live safe tile gateway (same Worker host as WORKER_URL); reads NO private
  // data. Fails CLOSED for buildings only — token/tile/script failure never
  // touches the hydrant map. The building UX (ADR 054 type colours, popup
  // fields, nav buttons) is ported from the Varna_buildings buildings module.
  // Everything below is namespaced under this block; it only reuses `map`,
  // `osmLayer`, `satLayer`, `WORKER_URL`, `flashStatus`, `getActiveTarget`.
  // =========================================================================

  // --- gateway + plugin config ---
  const BUILDING_TOKEN_URL = WORKER_URL + 'tiles/buildings/token';
  const BUILDING_TILE_URL  = WORKER_URL + 'tiles/buildings/v1/{z}/{x}/{y}.mvt?token={token}';
  const BUILDING_MIN_Z = 15;   // gateway serves z15-17; below 15 = suspend (no requests)
  const BUILDING_MAX_Z = 17;   // native max; overzoom-display above via maxNativeZoom
  // Leaflet.VectorGrid (bundled = includes pbf + vector-tile); loaded on demand
  // the first time buildings are turned on, with SRI pinning (probe 2026-06-22).
  const VECTORGRID_CDN = 'https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.min.js';
  const VECTORGRID_SRI = 'sha384-QDTA8MXPewzk8Ryt7UyfUmk+WcHcVYLcxAydowJk1WPgwjdXOIlJIDz25ITLVwTl';

  // ADR 054 D1/D2 building-type colour lens (verbatim from render.js TYPE_STYLES),
  // keyed by the tile `bt` property. `unknown` is the explicit dashed residual.
  const BUILDING_TYPE_STYLES = {
    block:         { color: '#1d4ed8', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.45 },
    house:         { color: '#15803d', weight: 1, fillColor: '#22c55e', fillOpacity: 0.42 },
    accommodation: { color: '#9a3412', weight: 1, fillColor: '#f97316', fillOpacity: 0.55 },
    non_res:       { color: '#334155', weight: 1, fillColor: '#64748b', fillOpacity: 0.40 },
    unknown:       { color: '#111827', weight: 2, fillColor: '#e5e7eb', fillOpacity: 0.45, dashArray: '2 3' }
  };
  // Bulgarian type labels (ported from render.js TYPE_LABEL_BG). Used for the
  // popup тип line when the tile carries no `bt_text` (current tiles omit it),
  // honouring the Bulgarian-UI constraint instead of showing the raw class.
  const BUILDING_TYPE_LABEL = {
    block: 'Многофамилна сграда', house: 'Къща', accommodation: 'Настаняване',
    non_res: 'Нежилищно', unknown: 'Неизвестно'
  };

  // --- building module state ---
  // NOTE: these `let`s must be initialised before the building layer is created
  // (lazily, on the 🏢 toggle, which fires after bootApp() — the IIFE's last
  // statement, below this block). Keep this block above bootApp().
  let tileToken = null, tileTokenExp = 0, tokenRefreshTimer = null;
  let vectorGridLoadPromise = null, buildingLayer = null, buildingsEnabled = false;
  let satelliteOn = false;
  // C — per-building detail (on-click). In-memory cache by bd; entrance markers
  // for the currently-open building only; a request token guards against a stale
  // fetch resolving after the user clicked elsewhere / closed the popup.
  const buildingDetailCache = new Map();
  let entranceMarkers = [];
  let currentBuildingPopup = null;
  let buildingDetailReq = 0;
  const BD_RE = /^b[0-9a-f]{16}$/;
  const BUILDING_DETAIL_URL = WORKER_URL + 'tiles/buildings/v1/detail/';

  // --- shared nav/action buttons (building popup + hydrant card) ------------
  // URL templates ported verbatim from Varna_buildings sectionUnits.js
  // (googleMapsUrl / streetViewUrl / googleMapsDirUrl / wazeUrl). Keyless
  // link-outs only (ToS-clean); finite-coord guard -> null row, never a broken
  // link. Coords are always the point's own lat/lng — never geocoded.
  function buildNavActions(lat, lng) {
    const la = Number(lat), lo = Number(lng);
    if (!isFinite(la) || !isFinite(lo)) return null;
    const row = document.createElement('div');
    row.className = 'nav-actions';
    const specs = [
      ['Street View', 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + la + ',' + lo],
      ['Google Maps', 'https://www.google.com/maps?q=' + la + ',' + lo],
      ['Закарай ме с Google Maps', 'https://www.google.com/maps/dir/?api=1&destination=' + la + ',' + lo],
      ['Закарай ме с Waze',        'https://waze.com/ul?ll=' + la + ',' + lo + '&navigate=yes']
    ];
    for (const spec of specs) {
      const a = document.createElement('a');
      a.className = 'nav-action';
      a.href = spec[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = spec[0];
      row.appendChild(a);
    }
    return row;
  }

  // --- building popup (safe tile props ONLY) -------------------------------
  function buildingPosInt(v) { const n = Number(v); return isFinite(n) && n > 0 ? n : null; }
  function buildingFloors(p) {
    const fl = buildingPosInt(p.fl);
    if (fl) return String(fl);
    const lo = buildingPosInt(p.fl_min), hi = buildingPosInt(p.fl_max);
    if (lo && hi) return lo === hi ? String(lo) : (lo + '–' + hi);
    if (lo) return String(lo);
    if (hi) return String(hi);
    return null;
  }
  function buildBuildingPopup(props, lat, lng) {
    const p = props || {};
    const wrap = document.createElement('div');
    wrap.className = 'building-popup';
    const typeLabel = p.bt_text || BUILDING_TYPE_LABEL[p.bt] || p.bt || null;
    if (typeLabel) {
      const t = document.createElement('div');
      t.className = 'bp-title';
      t.textContent = typeLabel;
      wrap.appendChild(t);
    }
    const addRow = (label, value) => {
      const r = document.createElement('div');
      r.className = 'bp-row';
      const l = document.createElement('span');
      l.className = 'bp-label';
      l.textContent = label + ': ';
      r.appendChild(l);
      r.appendChild(document.createTextNode(value));
      wrap.appendChild(r);
    };
    const floors = buildingFloors(p);
    if (floors) addRow('Етажи', floors);
    const en = buildingPosInt(p.en);
    if (en) addRow('Входове', String(en));
    const u = buildingPosInt(p.u);
    if (u) addRow('Апартаменти', String(u));
    // Lazy per-building detail (entrance list + linked markers) lands here once
    // fetched; stays collapsed (CSS :empty) for tile-summary-only buildings.
    const detailBox = document.createElement('div');
    detailBox.className = 'bp-detailbox';
    wrap.appendChild(detailBox);
    const nav = buildNavActions(lat, lng);
    if (nav) wrap.appendChild(nav);
    return wrap;
  }

  // --- per-building detail: fetch + render (C) ------------------------------
  // Bulgarian object-type labels for an entrance breakdown (counts only).
  const BREAKDOWN_LABEL_BG = {
    apartment: 'ап.', studio: 'студио', office: 'офис', commercial: 'търговски',
    garage: 'гараж', storage: 'склад', basement: 'мазе', other: 'друго'
  };
  function escAttr(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function formatBreakdownBg(b) {
    if (!b || typeof b !== 'object') return null;
    const order = ['apartment', 'studio', 'office', 'commercial', 'garage', 'storage', 'basement', 'other'];
    const parts = [];
    for (const k of order) if (Number.isInteger(b[k]) && b[k] > 0) parts.push(b[k] + ' ' + (BREAKDOWN_LABEL_BG[k] || k));
    return parts.length ? parts.join(' · ') : null;
  }
  function entranceLabel(e, i) {
    return (e && typeof e.en === 'string' && e.en) ? ('вх. ' + e.en) : ('вход ' + (i + 1));
  }
  function entranceSummary(e) {
    const parts = [];
    if (Number.isInteger(e.floors) && e.floors > 0) parts.push(e.floors + ' ет');
    if (Number.isInteger(e.apartment_count) && e.apartment_count > 0) parts.push(e.apartment_count + ' ап');
    return parts.length ? ' · ' + parts.join(' · ') : '';
  }
  function entranceIcon(label, active) {
    return L.divIcon({
      className: 'entrance-pin-wrap',
      html: '<div class="entrance-pin' + (active ? ' active' : '') + '">' + escAttr(label) + '</div>',
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
  }
  function clearEntranceMarkers() {
    if (entranceMarkers.length) { entranceMarkers.forEach((m) => map.removeLayer(m)); entranceMarkers = []; }
  }
  async function fetchBuildingDetail(bd) {
    if (buildingDetailCache.has(bd)) return buildingDetailCache.get(bd);
    const token = await ensureTileToken(false);
    const url = BUILDING_DETAIL_URL + encodeURIComponent(bd) + '.json?token=' + encodeURIComponent(token);
    const resp = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit' });
    if (!resp.ok) throw new Error('detail http ' + resp.status);
    const data = await resp.json();
    buildingDetailCache.set(bd, data);   // cache successes only (errors stay retryable)
    return data;
  }
  // Render the selectable entrance list into the popup's detail box AND drop a
  // linked marker per entrance with a pin. Row<->marker selection is two-way.
  function renderBuildingEntrances(detailBox, detail) {
    clearEntranceMarkers();   // self-sufficient: never accumulate markers across renders
    const entrances = (detail && Array.isArray(detail.entrances)) ? detail.entrances : [];
    if (!entrances.length) return;
    detailBox.replaceChildren();
    const head = document.createElement('div');
    head.className = 'bp-ent-head';
    head.textContent = 'Входове';
    detailBox.appendChild(head);
    const list = document.createElement('div');
    list.className = 'bp-entrances';
    detailBox.appendChild(list);

    const entries = entrances.map((e, i) => ({ e, i, row: null, marker: null }));
    function selectEntrance(i) {
      for (const en of entries) {
        const on = en.i === i;
        if (en.row) en.row.classList.toggle('active', on);
        if (en.marker) {
          const el = en.marker.getElement();
          const pin = el && el.querySelector('.entrance-pin');
          if (pin) pin.classList.toggle('active', on);
        }
      }
      const sel = entries[i];
      if (sel && sel.row && sel.row.scrollIntoView) sel.row.scrollIntoView({ block: 'nearest' });
    }

    for (const entry of entries) {
      const { e, i } = entry;
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'bp-entrance';
      const sum = document.createElement('div');
      sum.className = 'bp-ent-sum';
      sum.textContent = entranceLabel(e, i) + entranceSummary(e);
      row.appendChild(sum);
      const bd = formatBreakdownBg(e.breakdown);
      if (bd) {
        const det = document.createElement('div');
        det.className = 'bp-ent-detail';
        det.textContent = bd;
        row.appendChild(det);
      }
      row.addEventListener('click', () => selectEntrance(i));
      list.appendChild(row);
      entry.row = row;

      const pin = e && e.pin;
      if (pin && isFinite(pin.lat) && isFinite(pin.lng)) {
        const m = L.marker([pin.lat, pin.lng], {
          icon: entranceIcon((e.en || String(i + 1)), false),
          zIndexOffset: 1200, keyboard: false
        });
        m.on('click', () => selectEntrance(i));
        m.addTo(map);
        entranceMarkers.push(m);
        entry.marker = m;
      }
    }
  }
  // Open a building popup: tile summary immediately, then lazy-fetch the detail
  // and render entrances/markers. Fail-closed: a missing/invalid bd or an offline
  // fetch leaves the popup usable with the summary only.
  function openBuildingDetailPopup(props, lat, lng) {
    clearEntranceMarkers();                       // clear the previous building's markers
    const p = props || {};
    const wrap = buildBuildingPopup(p, lat, lng);
    const detailBox = wrap.querySelector('.bp-detailbox');
    const popup = L.popup({
      closeButton: true, autoPan: true,
      autoPanPaddingTopLeft: POPUP_AUTOPAN_TL,
      autoPanPaddingBottomRight: POPUP_AUTOPAN_BR
    }).setLatLng([lat, lng]).setContent(wrap).openOn(map);
    currentBuildingPopup = popup;
    popup.on('remove', () => {
      if (currentBuildingPopup === popup) currentBuildingPopup = null;
      clearEntranceMarkers();
    });

    const bd = (typeof p.bd === 'string' && BD_RE.test(p.bd)) ? p.bd : null;
    if (!bd || !detailBox) return;
    const reqToken = ++buildingDetailReq;
    if (detailBox) {
      const hint = document.createElement('div');
      hint.className = 'bp-detail-hint';
      hint.textContent = 'Зареждане на детайли…';
      detailBox.appendChild(hint);
    }
    fetchBuildingDetail(bd).then((detail) => {
      // stale-guard: only render if this is still the open building popup + request
      if (reqToken !== buildingDetailReq || currentBuildingPopup !== popup) return;
      detailBox.replaceChildren();
      renderBuildingEntrances(detailBox, detail);
      popup.update();   // recompute popup size/position for the new content
    }).catch(() => {
      // offline / error: drop the hint, keep the summary popup usable (quiet)
      if (reqToken === buildingDetailReq && currentBuildingPopup === popup) detailBox.replaceChildren();
    });
  }

  // Search->detail (C) BEST-EFFORT proximity bridge. A search result carries no bd,
  // so we open the building detail ONLY when exactly ONE building feature is rendered
  // under the result pin — by replaying a real tap on that feature's SVG path
  // (identical to a user click; no VectorGrid internals). This is best-effort, NOT
  // exact: a geocoder pin can fall on an adjacent footprint, so the opened building
  // may differ from the searched address. When there is no single building under the
  // pin we fall back to the plain address popup. Returns true iff a NEW building popup
  // actually opened.
  function tryOpenBuildingDetailAt(lat, lng) {
    if (!buildingsEnabled || !buildingLayer || !map.hasLayer(buildingLayer)) return false;
    if (placementActive || manualMode) return false;
    let pt;
    try { pt = map.latLngToContainerPoint([lat, lng]); } catch (_) { return false; }
    const rect = map.getContainer().getBoundingClientRect();
    const cx = rect.left + pt.x, cy = rect.top + pt.y;
    let paths;
    try {
      const els = document.elementsFromPoint(cx, cy) || [];
      paths = els.filter((el) => el && el.tagName && el.tagName.toLowerCase() === 'path' &&
        el.classList && el.classList.contains('leaflet-interactive'));
    } catch (_) { return false; }
    if (paths.length !== 1) return false;   // 0 = no building under pin; >1 = ambiguous -> no guess
    const before = currentBuildingPopup;
    try {
      paths[0].dispatchEvent(new MouseEvent('click', {
        bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy
      }));
    } catch (_) { return false; }
    return !!currentBuildingPopup && currentBuildingPopup !== before;  // a new building popup opened
  }

  // --- shared popup auto-pan padding ---------------------------------------
  // Keep Leaflet popups clear of the fixed header stack (topbar + mode bar +
  // search bar) when they auto-pan into view. Leaflet does not know about our
  // absolutely positioned overlays, so without this a popup opened near the top
  // edge can land hidden behind the header. Top padding ≈ header height (~140px)
  // + gap; bottom padding keeps the popup off the corner locate FAB.
  const POPUP_AUTOPAN_TL = [16, 150];
  const POPUP_AUTOPAN_BR = [16, 96];

  // --- hydrant popup (Leaflet popup; modeled on buildBuildingPopup) ---------
  // DOM-built with textContent only (never innerHTML) — the verifier note is
  // moderated free-text from the /issues feed. Distance/direction are a snapshot
  // taken from the current GPS fix at open time (the popup is not live-updated).
  function buildHydrantPopup(h) {
    const wrap = document.createElement('div');
    wrap.className = 'hydrant-popup';

    const title = document.createElement('div');
    title.className = 'hp-title';
    title.textContent = h.address || ('Хидрант ' + h.id);
    wrap.appendChild(title);

    const addRow = (label, value) => {
      const r = document.createElement('div');
      r.className = 'hp-row';
      const l = document.createElement('span');
      l.className = 'hp-label';
      l.textContent = label + ': ';
      r.appendChild(l);
      r.appendChild(document.createTextNode(value));
      wrap.appendChild(r);
    };

    const typeLabel = hydrantTypeLabel(h.type);
    if (typeLabel) addRow('Тип', typeLabel);

    // Distance + direction snapshot — only when we have a GPS fix to measure from.
    if (lastFix) {
      const d = haversine(lastFix.lat, lastFix.lon, h.coords[1], h.coords[0]);
      addRow('Разстояние', formatDist(d));
      const bear = bearing(lastFix.lat, lastFix.lon, h.coords[1], h.coords[0]);
      addRow('Посока', cardinal(bear) + ' · ' + Math.round(bear) + '°');
    }

    const opLabel = OPERATIONAL_LABELS[h.operational_status];
    if (opLabel) addRow('Състояние', opLabel);

    if (h.verifier_note) {
      const note = document.createElement('div');
      note.className = 'hp-note';
      note.textContent = h.verifier_note;
      wrap.appendChild(note);
    }

    // Reuse the shared nav link-outs (Street View · Google Maps · Закарай ме с
    // Google Maps · Waze). coords are [lon, lat]; buildNavActions takes (lat, lng).
    const nav = buildNavActions(h.coords[1], h.coords[0]);
    if (nav) wrap.appendChild(nav);

    const reportBtn = document.createElement('button');
    reportBtn.type = 'button';
    reportBtn.className = 'hp-report-btn';
    reportBtn.textContent = 'Докладвай';
    reportBtn.addEventListener('click', () => showReportTypePicker(h));
    wrap.appendChild(reportBtn);

    return wrap;
  }

  // Opens the hydrant detail popup as a standalone Leaflet popup anchored to the
  // hydrant's coordinates (NOT bound to the marker) — like the building popup —
  // so a refresh() that rebuilds markers does not close it.
  function openHydrantPopup(h) {
    const node = buildHydrantPopup(h);
    L.popup({
      closeButton: true, autoPan: true,
      autoPanPaddingTopLeft: POPUP_AUTOPAN_TL,
      autoPanPaddingBottomRight: POPUP_AUTOPAN_BR
    }).setLatLng([h.coords[1], h.coords[0]]).setContent(node).openOn(map);
  }

  // Marker tap entry point: consume any pending pre-pick first (report flow);
  // otherwise select the hydrant (pin highlight + line to the user via the
  // mode-appropriate setter) and open its detail popup. Long-press still routes

  // --- token (memory only; refresh before exp; fail closed) ----------------
  async function ensureTileToken(force) {
    const now = Math.floor(Date.now() / 1000);
    if (!force && tileToken && now < tileTokenExp - 60) return tileToken;
    const resp = await fetch(BUILDING_TOKEN_URL, { method: 'GET', mode: 'cors', credentials: 'omit' });
    if (!resp.ok) throw new Error('token http ' + resp.status);
    const data = await resp.json();
    if (!data || !data.token || typeof data.exp !== 'number') throw new Error('token malformed');
    tileToken = data.token;
    tileTokenExp = data.exp;
    if (buildingLayer) buildingLayer.options.token = tileToken;  // new tile fetches use fresh token

  }
  function scheduleTokenRefresh() {
    if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }

    // resurrected when an in-flight enable's token fetch resolves after the user
    // already toggled off (otherwise disable's clear would be undone).
    if (!buildingsEnabled) return;
    const now = Math.floor(Date.now() / 1000);
    const delayMs = Math.max(15, tileTokenExp - now - 60) * 1000;
    tokenRefreshTimer = setTimeout(() => {
      if (!buildingsEnabled) return;   // suspend refresh while buildings are off
      ensureTileToken(true).catch(() => {});  // fail closed: stale tiles 404/401 quietly

  }

  // --- VectorGrid loader (load if absent) ----------------------------------
  function loadVectorGrid() {
    if (window.L && L.vectorGrid && L.vectorGrid.protobuf) return Promise.resolve();
    if (vectorGridLoadPromise) return vectorGridLoadPromise;
    vectorGridLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = VECTORGRID_CDN;
      s.integrity = VECTORGRID_SRI;
      s.crossOrigin = 'anonymous';
      s.async = true;
      s.onload = () => (window.L && L.vectorGrid && L.vectorGrid.protobuf)
        ? resolve() : reject(new Error('vectorgrid missing after load'));
      s.onerror = () => { vectorGridLoadPromise = null; reject(new Error('vectorgrid script failed')); };

          const childrenByGroup = new Map();
          for (const s of ranked) { if (s.e.en === undefined) continue; const key = s.e.g; if (key == null || !repByGroup.has(key)) continue; if (!childrenByGroup.has(key)) childrenByGroup.set(key, []); childrenByGroup.get(key).push(s); }
          const childSort = function (a, b) { const na = /^[0-9]+$/.test(a.e.en) ? parseInt(a.e.en,10) : NaN, nb = /^[0-9]+$/.test(b.e.en) ? parseInt(b.e.en,10) : NaN; const an = !Number.isNaN(na), bn = !Number.isNaN(nb); if (an && bn && na !== nb) return na - nb; if (an !== bn) return an ? -1 : 1; if (a.e.en !== b.e.en) return String(a.e.en).localeCompare(String(b.e.en)); return (a.e._ord||0) - (b.e._ord||0); };
          const bareDistrictCount = new Map(); const groupList = [];
          for (const pair of repByGroup) { const key = pair[0], rep = pair[1]; const children = (childrenByGroup.get(key) || []).slice().sort(childSort); groupList.push({ key: key, rep: rep, children: children }); const d = rep.e.d; if (d != null) bareDistrictCount.set(d, (bareDistrictCount.get(d)||0)+1); }
          groupList.sort(function (a, b) { const da = a.rep.e.d == null ? Infinity : a.rep.e.d, db = b.rep.e.d == null ? Infinity : b.rep.e.d; if (da !== db) return da - db; return (a.rep.e._ord||0) - (b.rep.e._ord||0); });
          const projectRow = function (s, role) { const e = s.e; return { kind: e.kind, en: e.en, pin: e.pin, d: e.d, label: e.label, display_id: e.display_id, allTokens: s.all, matched: s.matched, exact: s.exactName + s.exactNum, prefix: s.prefix, fuzzy: s.fuzzy, bareRole: role, block: qBlkDisplay }; };
          const bareOut = [];
          for (const g of groupList) { bareOut.push(projectRow(g.rep, 'parent')); for (const c of g.children) bareOut.push(projectRow(c, 'child')); }
          bareOut.bareBlockHeader = { block: qBlkDisplay, groups: groupList.length, districts: Array.from(bareDistrictCount, function (p) { return { district_enum: p[0], count: p[1] }; }).sort(function (a, b) { return a.district_enum - b.district_enum; }) };
          return bareOut;
        }
      }

      const out = ranked.slice(0, SEARCH_LIMIT).map(function (s) {
        const e = s.e;
        return { kind: e.kind, en: e.en, pin: e.pin, d: e.d, label: e.label, display_id: e.display_id, allTokens: s.all, matched: s.matched, exact: s.exactName + s.exactNum, prefix: s.prefix, fuzzy: s.fuzzy };
      });
      if (blockHeader) out.blockHeader = blockHeader;
      return out;
    }

    // ---- lazy load + cache (memory for the session + Cache API offline) ----------
    // TWO payloads: the matcher index (search_index.json) + the display rows
    // (address_rows.json). Both lazy-load on first focus, are parsed once, and are
    // persisted to the Cache API so a return visit works offline. The index is only
    // published to `searchIndex` AFTER prepareIndex() finishes (so a racing query
    // never sees a half-built inverted index).
    const SEARCH_INDEX_URL = 'data/search_index.json';
    const ADDRESS_ROWS_URL = 'data/address_rows.json';
    const SEARCH_CACHE = 'fire-varna-search-v2'; // v2 = geocoder payload (v1 was section_units)
    const RESULT_LIMIT = 10;
    const DEBOUNCE_MS = 120;
    let searchIndex = null;       // prepared matcher index (memory cache)
    let searchDataPromise = null; // in-flight load (dedupes concurrent focus/input)

    async function fetchCachedJson(url) {
      try {
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        // Persist a clone for offline use (best-effort; never blocks the parse).
        if (typeof caches !== 'undefined') {
          try { const c = await caches.open(SEARCH_CACHE); await c.put(url, resp.clone()); } catch (e) {}
        }
        return await resp.json();
      } catch (netErr) {
        // Offline fallback: serve the previously cached copy if we have one.
        if (typeof caches !== 'undefined') {
          try { const c = await caches.open(SEARCH_CACHE); const hit = await c.match(url); if (hit) return await hit.json(); } catch (e) {}
        }
        throw netErr;
      }
    }

    async function ensureSearchData() {
      if (searchIndex) return searchIndex;
      if (searchDataPromise) return searchDataPromise;
      searchDataPromise = (async function () {
        try {
          const [idx, rowsPayload] = await Promise.all([
            fetchCachedJson(SEARCH_INDEX_URL),
            fetchCachedJson(ADDRESS_ROWS_URL),
          ]);
          addressRows = (rowsPayload && Array.isArray(rowsPayload.rows)) ? rowsPayload.rows : [];
          addrFieldIdx = buildAddressFieldIndex(rowsPayload);
          districtNames = (idx && Array.isArray(idx.district_names)) ? idx.district_names : [];
          prepareIndex(idx);        // build vocab/inverted/area-vocab + _ord (once)
          searchIndex = idx;        // publish only AFTER fully prepared
          return searchIndex;
        } catch (err) {
          searchDataPromise = null; // allow a later retry
          throw err;
        }
      })();
      return searchDataPromise;
    }

    // ---- dropdown rendering (textContent only; never innerHTML) ----
    let currentResults = [];
    function hideResults() { resultsEl.classList.remove('visible'); resultsEl.replaceChildren(); currentResults = []; }
    function showStatus(text) {
      const d = document.createElement('div'); d.className = 'asr-status'; d.textContent = text;
      resultsEl.replaceChildren(d); resultsEl.classList.add('visible');
    }
    // Chip per geocoder kind: an entrance (mf + en) -> "вход"; a parcel -> "парцел";
    // an MF section -> "сграда"; a plain address -> "адрес".
    function hitChip(hit) {
      if (hit.kind === 'mf' && hit.en != null && hit.en !== undefined) return { cls: 'entrance', label: 'вход' };
      if (hit.kind === 'parcel') return { cls: 'complex', label: 'парцел' };
      if (hit.kind === 'mf') return { cls: 'complex', label: 'сграда' };
      return { cls: 'complex', label: 'адрес' };
    }
    function renderResults(rows) {
      currentResults = rows;
      if (!rows.length) { showStatus('Няма съвпадения'); return; }
      const frag = document.createDocumentFragment();
      // Optional район/block group header (display-only; no personal data). Set by
      // runGeocoderSearch for an area+block query (blockHeader) or a bare-block query
      // (bareBlockHeader). district_names[*] is the public район enum table.
      if (rows.blockHeader && rows.blockHeader.count > 0) {
        const bh = rows.blockHeader;
        const noun = bh.count === 1 ? 'блок' : 'блока';
        const raion = (bh.district_enum != null && districtNames[bh.district_enum]) ? (' в район ' + districtNames[bh.district_enum]) : '';
        const h = document.createElement('div'); h.className = 'asr-group-header';
        h.textContent = bh.count + ' ' + noun + ' № ' + bh.block + raion;
        frag.appendChild(h);
      } else if (rows.bareBlockHeader) {
        const bbh = rows.bareBlockHeader;
        const noun = bbh.groups === 1 ? 'блок' : 'блока';
        const nd = (bbh.districts || []).length;
        const h = document.createElement('div'); h.className = 'asr-group-header';
        h.textContent = bbh.groups + ' ' + noun + ' № ' + bbh.block + (nd > 1 ? (' в ' + nd + ' района') : '');
        frag.appendChild(h);
      }
      // runGeocoderSearch caps a normal query at 8; a bare-block surface can return
      // many rows, so the dropdown render is bounded by RESULT_LIMIT (data-idx stays
      // aligned to currentResults for click resolution).
      const n = Math.min(rows.length, RESULT_LIMIT);
      for (let i = 0; i < n; i++) {
        const r = rows[i];
        const item = document.createElement('div');
        item.className = 'asr-item';
        item.setAttribute('role', 'option');
        item.dataset.idx = String(i);
        const spec = hitChip(r);
        const chip = document.createElement('span');
        chip.className = 'asr-kind ' + spec.cls;
        chip.textContent = spec.label;
        const body = document.createElement('span');
        body.className = 'asr-body';
        const title = document.createElement('span');
        title.className = 'asr-title';
        title.textContent = formatAddressHit(r);
        body.appendChild(title);
        const raionName = r.d != null && districtNames[r.d] ? districtNames[r.d] : '';
        if (raionName) {
          const meta = document.createElement('span');
          meta.className = 'asr-meta';
          meta.textContent = 'район ' + raionName;
          body.appendChild(meta);
        }
        item.appendChild(chip); item.appendChild(body);
        frag.appendChild(item);
      }
      resultsEl.replaceChildren(frag);
      resultsEl.classList.add('visible');
    }

    // ---- result selection: fly + single marker + standalone popup ----
    let searchMarker = null;
    function clearSearchMarker() { if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; } }
    function searchPinIcon() {
      return L.divIcon({ className: 'search-pin-wrapper', html: '<div class="search-pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    }
    function openSearchPopup(label, lat, lng) {
      const wrap = document.createElement('div');
      wrap.className = 'search-popup';
      const t = document.createElement('div');
      t.className = 'sp-title';
      t.textContent = label;
      wrap.appendChild(t);
      const nav = buildNavActions(lat, lng); // Street View · Google Maps · nav — NO "Докладвай"
      if (nav) wrap.appendChild(nav);
      L.popup({ closeButton: true, autoPan: true, autoPanPaddingTopLeft: POPUP_AUTOPAN_TL, autoPanPaddingBottomRight: POPUP_AUTOPAN_BR })
        .setLatLng([lat, lng]).setContent(wrap).openOn(map);
    }
    function selectResult(r) {
      if (!r || !Array.isArray(r.pin) || r.pin.length !== 2) return;
      const lat = Number(r.pin[0]), lng = Number(r.pin[1]);
      if (!isFinite(lat) || !isFinite(lng)) return; // validate pin
      const label = formatAddressHit(r);            // resolved address (never cadnum)
      clearSearchMarker(); // replace any previous result marker
      searchMarker = L.marker([lat, lng], { icon: searchPinIcon(), zIndexOffset: 1500, keyboard: false }).addTo(map);
      searchMarker.on('click', function () { openSearchPopup(label, lat, lng); });
      hideResults();

      // SEARCH -> DETAIL (C). Priority: (1) a direct bd on the result (the geocoder
      // index carries none today, but honor it if ever added); (2) for a building
      // result ('mf') with the building layer on, a BEST-EFFORT proximity match — open
      // the C detail only if exactly one building sits under the pin; (3) otherwise the
      // plain address popup (unchanged). Best-effort: the pin may sit over an adjacent
      // footprint, so the match can be approximate; on any doubt it falls back to the
      // address popup.
      const directBd = (typeof r.bd === 'string' && BD_RE.test(r.bd)) ? r.bd : null;
      if (directBd) {
        map.flyTo([lat, lng], Math.max(map.getZoom(), 17));
        clearSearchMarker();                         // building detail supersedes the address pin
        // Pass the resolved address (never cadnum) as a title fallback so the popup
        // still shows context if the detail fetch is offline/404.
        openBuildingDetailPopup({ bd: directBd, bt_text: label }, lat, lng);
        return;
      }
      const canUpgrade = r.kind === 'mf' && buildingsEnabled && !placementActive && !manualMode;
      map.flyTo([lat, lng], Math.max(map.getZoom(), 17));
      if (!canUpgrade) { openSearchPopup(label, lat, lng); return; }

      // Defer until the fly settles + tiles render, then try the unambiguous match.
      let done = false;
      const attempt = () => {
        if (done) return; done = true;
        let opened = false;
        try { opened = tryOpenBuildingDetailAt(lat, lng); } catch (_) { opened = false; }
        if (opened) clearSearchMarker();             // building popup replaces the address pin
        else openSearchPopup(label, lat, lng);       // fallback: plain address popup
      };
      map.once('moveend', () => setTimeout(attempt, 180));
      setTimeout(attempt, 1200);                      // safety net if moveend never fires
    }

    // ---- query runner (debounced; stale-guarded) ----
    let debounceTimer = null;
    async function runQuery(value) {
      const q = (value || '').trim();
      if (q.length < 1) { hideResults(); clearSearchMarker(); return; }
      let index;
      try { index = await ensureSearchData(); }
      catch (e) { showStatus('Търсачката не е налична офлайн'); return; }
      if (inputEl.value.trim() !== q) return; // a newer keystroke superseded this run
      renderResults(runGeocoderSearch(q, index));
    }

    // ---- events ----
    inputEl.addEventListener('focus', function () { ensureSearchData().catch(function () {}); });
    inputEl.addEventListener('input', function (ev) {
      const v = ev.target.value;
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () { runQuery(v); }, DEBOUNCE_MS);
    });
    inputEl.addEventListener('keydown', async function (ev) {
      if (ev.key === 'Escape') {
        if (debounceTimer) { clearTimeout(debounceTimer); debounceTimer = null; }
        inputEl.value = ''; hideResults(); clearSearchMarker(); inputEl.blur();
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (debounceTimer) { clearTimeout(debounceTimer); debounceTimer = null; }
        const q = inputEl.value.trim();
        if (!q) return;                              // empty box -> no stale selection
        let index;
        try { index = await ensureSearchData(); }   // works during the cold-load window too
        catch (e) { showStatus('Търсачката не е налична офлайн'); return; }
        if (inputEl.value.trim() !== q) return;      // a newer keystroke superseded this
        renderResults(runGeocoderSearch(q, index));
        if (currentResults[0]) selectResult(currentResults[0]);
      }
    });
    resultsEl.addEventListener('click', function (ev) {
      const item = ev.target.closest('.asr-item');
      if (!item) return;
      const idx = parseInt(item.dataset.idx, 10);
      if (Number.isFinite(idx) && currentResults[idx]) selectResult(currentResults[idx]);
    });
    // Click outside the search bar hides the dropdown (covers map clicks too).
    document.addEventListener('click', function (ev) {
      if (!ev.target.closest('.search-bar')) hideResults();
    });
  })();

  // --- wiring ---------------------------------------------------------------
  const buildingsBtnEl = document.getElementById('buildingsToggle');
  if (buildingsBtnEl) buildingsBtnEl.addEventListener('click', () => {
    if (buildingsEnabled) disableBuildings(); else enableBuildings();
  });
  const basemapBtnEl = document.getElementById('basemapToggle');
  if (basemapBtnEl) basemapBtnEl.addEventListener('click', () => setBasemap(!satelliteOn));

  // ===== Auto-start =====
  bootApp();
})();
</script>

</body>
</html>
