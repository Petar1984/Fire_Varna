<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>E0 probe — protomaps-leaflet (vector PMTiles over Leaflet)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,sans-serif}
  #map{position:absolute;inset:0;bottom:132px}
  #panel{position:absolute;left:0;right:0;bottom:0;height:132px;overflow:auto;
    padding:8px 10px;background:#0b1f33;color:#e8f0f8;box-sizing:border-box}
  code{color:#ffd27f}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>E0 protomaps-leaflet probe</b> — minimal migration: keep Leaflet + all overlays,
  add a vector PMTiles basemap.<br>
  Open on a real 375px device. Pass <code>?pmtiles=URL</code> (a Varna basemap .pmtiles,
  e.g. served locally by <code>python -m http.server 8000</code>).<br>
  <div id="out">measuring…</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.js"></script>
<script>
const t0 = performance.now();
const q = new URLSearchParams(location.search);
const PMTILES = q.get('pmtiles') || 'http://127.0.0.1:8000/data/basemaps/varna_basemap.pmtiles';
const out = document.getElementById('out');
const map = L.map('map', { attributionControl: false }).setView([43.2141, 27.9147], 13);
L.control.attribution({ prefix: false })
  .addAttribution('© OpenStreetMap contributors (ODbL) · Fire_Varna local patch').addTo(map);

// sample overlay markers = proof that existing Leaflet overlays keep working
[[43.2141,27.9147],[43.205,27.92],[43.22,27.90]].forEach(c =>
  L.circleMarker(c, { radius: 7, color: '#e23', weight: 3 }).addTo(map));

let firstIdle = null;
try {
  // protomaps-leaflet vector layer + theme (Cyrillic labels come from the tiles' name field)
  const layer = protomapsL.leafletLayer({ url: PMTILES, theme: 'light' });
  layer.addTo(map);
  map.on('load moveend', () => { if (!firstIdle) { firstIdle = performance.now(); report(); } });
  map.whenReady(() => setTimeout(() => { if (!firstIdle) { firstIdle = performance.now(); report(); } }, 800));
} catch (e) { out.innerHTML = 'ERROR: ' + e + '<br>(pass a reachable ?pmtiles=URL)'; }

function report() {
  const dt = Math.round((firstIdle || performance.now()) - t0);
  out.innerHTML =
    `time-to-first-idle: <code>${dt} ms</code> · pmtiles: <code>${PMTILES}</code><br>` +
    `Report for STOP E0: first-interactive ms, pan/zoom smoothness (subjective), ` +
    `Cyrillic label legibility at z14–z17, memory (devtools).`;
}
</script>
</body>
</html>
